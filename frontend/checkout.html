<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — WEMIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .checkout-progress { display: flex; align-items: center; justify-content: center; gap: var(--space-2); margin-bottom: var(--space-6); }
  .checkout-progress-step { width: 34px; height: 4px; border-radius: 2px; background: var(--color-border); transition: background 0.2s; }
  .checkout-progress-step.done { background: var(--color-success); }
  .checkout-progress-step.active { background: var(--color-gold); }
  .checkout-summary { text-align: left; background: #faf9f4; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: var(--space-4) var(--space-4); margin: var(--space-4) 0; font-size: 0.85rem; }
  .checkout-summary-row { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); padding: var(--space-1) 0; }
  .checkout-summary-row.total { border-top: 1px solid var(--color-border); margin-top: var(--space-2); padding-top: var(--space-2); font-weight: 700; }
  .checkout-summary-label { color: var(--color-text-muted); flex-shrink: 0; white-space: nowrap; }
  .checkout-summary-row > span:last-child { text-align: right; }
</style>
</head>
<body>

<div id="topnav-root"></div>

<main class="auth-shell">
  <div class="card form-card" style="text-align:center;">
    <div id="content">
      <span class="spinner" style="width:28px;height:28px;"></span>
      <h2>Loading order&hellip;</h2>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
const orderId = new URLSearchParams(window.location.search).get('order');
const content = document.getElementById('content');
let pollCount = 0;
let pollTimer = null;
let order = null;

function progressHtml(step) {
  // step: 1 = waiting, 2 = confirmed/failed/cancelled (terminal)
  return `
    <div class="checkout-progress">
      <div class="checkout-progress-step done"></div>
      <div class="checkout-progress-step ${step >= 1 ? 'active' : ''} ${step > 1 ? 'done' : ''}"></div>
      <div class="checkout-progress-step ${step > 1 ? 'done' : ''}"></div>
    </div>
  `;
}

function summaryHtml() {
  if (!order) return '';
  const txn = (order.transactions || [])[0];
  return `
    <div class="checkout-summary">
      <div class="checkout-summary-row"><span class="checkout-summary-label">Story</span><span>${escapeHtml(order.listing_title)}</span></div>
      <div class="checkout-summary-row"><span class="checkout-summary-label">Seller</span><span>${escapeHtml(order.seller_username || '—')}</span></div>
      <div class="checkout-summary-row"><span class="checkout-summary-label">Payment method</span><span>${escapeHtml((order.payment_provider || '—').replace('_', ' '))}</span></div>
      ${txn ? `<div class="checkout-summary-row"><span class="checkout-summary-label">Reference</span><span style="font-family:monospace; font-size:0.8rem;">${escapeHtml(txn.reference)}</span></div>` : ''}
      <div class="checkout-summary-row total"><span>Total</span><span>${money(order.amount, order.currency)}</span></div>
    </div>
  `;
}

function backToListingBtn(label) {
  if (!order?.listing_slug) return '';
  return `<a href="listing.html?slug=${encodeURIComponent(order.listing_slug)}" class="btn btn-outline" style="margin-top: var(--space-2);">${label}</a>`;
}

async function cancelOrder(btn) {
  if (!confirm('Cancel this payment? You can always start a new purchase from the listing page.')) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Cancelling&hellip;';
  try {
    await apiFetch(`/api/payments/orders/${encodeURIComponent(orderId)}/cancel/`, { method: 'POST' });
    clearInterval(pollTimer);
    showResult('cancelled');
  } catch (err) {
    alert(formatApiError(err));
    btn.disabled = false;
    btn.textContent = 'Cancel payment';
  }
}

function showResult(orderStatus) {
  clearInterval(pollTimer);
  if (orderStatus === 'paid') {
    content.innerHTML = `
      ${progressHtml(2)}
      <h2 style="color:var(--color-success);">Payment confirmed</h2>
      <p class="text-muted">The story is now unlocked.</p>
      ${summaryHtml()}
      <a href="dashboard.html" class="btn" style="margin-top: var(--space-2);">Go to dashboard</a>
    `;
  } else if (orderStatus === 'failed') {
    content.innerHTML = `
      ${progressHtml(2)}
      <h2 style="color:var(--color-danger);">Payment failed</h2>
      <p class="text-muted">The payment did not complete.</p>
      ${summaryHtml()}
      <div style="display:flex; gap: var(--space-2); justify-content:center; flex-wrap:wrap; margin-top: var(--space-2);">
        ${backToListingBtn('Retry payment')}
        <a href="index.html" class="btn btn-ghost">Back to marketplace</a>
      </div>
    `;
  } else if (orderStatus === 'cancelled') {
    content.innerHTML = `
      ${progressHtml(2)}
      <h2>Payment cancelled</h2>
      <p class="text-muted">No charge was made. You can start a new purchase any time.</p>
      ${summaryHtml()}
      <div style="display:flex; gap: var(--space-2); justify-content:center; flex-wrap:wrap; margin-top: var(--space-2);">
        ${backToListingBtn('Try again')}
        <a href="index.html" class="btn btn-ghost">Back to marketplace</a>
      </div>
    `;
  } else {
    content.innerHTML = `
      ${progressHtml(1)}
      <h2>Still waiting&hellip;</h2>
      <p class="text-muted">This is taking longer than expected. Check your order status in the dashboard, or contact support if the payment already went through on your phone.</p>
      ${summaryHtml()}
      <div style="display:flex; gap: var(--space-2); justify-content:center; flex-wrap:wrap; margin-top: var(--space-2);">
        <a href="dashboard.html" class="btn btn-outline">Go to dashboard</a>
        ${backToListingBtn('Back to listing')}
      </div>
    `;
  }
}

function renderWaiting() {
  content.innerHTML = `
    ${progressHtml(1)}
    <span class="spinner" style="width:28px;height:28px;"></span>
    <h2>Waiting for payment confirmation&hellip;</h2>
    <p class="text-muted">Complete the payment on your phone (mobile money PIN prompt) or the payment gateway page. This will update automatically once confirmed.</p>
    ${summaryHtml()}
    <button class="btn btn-outline btn-sm" id="cancel-btn" style="margin-top: var(--space-2);">Cancel payment</button>
  `;
  document.getElementById('cancel-btn').addEventListener('click', (e) => cancelOrder(e.currentTarget));
}

async function loadOrderDetail() {
  try {
    order = await apiFetch(`/api/payments/orders/${encodeURIComponent(orderId)}/`);
  } catch (err) {
    order = null; // summary is supplementary -- polling still proceeds without it
  }
}

async function poll() {
  if (!orderId) {
    content.innerHTML = `<div class="alert alert-error">No order specified.</div>`;
    return;
  }
  pollCount += 1;
  try {
    const data = await apiFetch(`/api/payments/orders/${encodeURIComponent(orderId)}/status/`);
    if (data.status === 'paid' || data.status === 'failed' || data.status === 'cancelled') {
      showResult(data.status);
    } else if (pollCount > 40) {
      showResult('timeout');
    }
  } catch (err) {
    if (err.status === 401) {
      // Session expired/invalid while waiting -- don't spin forever with
      // no explanation. The payment may still have gone through; send
      // them to log back in and check their dashboard rather than
      // leaving them stuck on an endless "waiting" spinner.
      clearInterval(pollTimer);
      content.innerHTML = `
        <h2 style="color:var(--color-danger);">Session expired</h2>
        <p class="text-muted">We couldn't confirm your payment status because you're no longer logged in. If you completed the payment, it should still go through -- log back in and check your dashboard.</p>
        <a href="login.html" class="btn" style="margin-top: var(--space-2);">Log in</a>
      `;
      return;
    }
    // keep polling silently on other, transient errors
  }
}

(async () => {
  if (!orderId) {
    content.innerHTML = `<div class="alert alert-error">No order specified.</div>`;
    return;
  }
  await loadOrderDetail();
  renderWaiting();
  pollTimer = setInterval(poll, 3000);
  poll();
})();
</script>
</body>
</html>
