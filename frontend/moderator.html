async function renderSettingsTab(content) {
  const isAdmin = ADMIN_ROLES.includes(CURRENT_USER?.role);
  content.innerHTML = `<p class="text-muted"><span class="spinner"></span> Loading&hellip;</p>`;
  try {
    const statusData = await apiFetch('/api/system-status/');

    content.innerHTML = `
      <h3 style="margin-bottom:var(--space-1);">Integrations</h3>
      <p class="text-muted" style="font-size:0.85rem; margin-top:0;">
        ${isAdmin ? 'Credentials are encrypted at rest and never shown in full once saved -- only a masked hint. Saved changes take effect immediately, no server restart needed.' : 'Viewing only -- editing credentials requires an admin account.'}
      </p>
      <div id="providers-area"></div>
      ${statusData.debug_mode ? `<div class="alert alert-error" style="margin:20px 0;"><strong>DEBUG mode is ON.</strong> This should be OFF in production.</div>` : ''}
      <h3 style="margin-bottom:var(--space-3); margin-top:var(--space-6);">Recent activity (audit log)</h3>
      <div id="audit-log-area"><p class="text-muted"><span class="spinner"></span> Loading&hellip;</p></div>
    `;

    const providersArea = document.getElementById('providers-area');
    providersArea.innerHTML = Object.keys(PROVIDER_META).map((key) => renderProviderCard(key, statusData[key], isAdmin)).join('');

    Object.keys(PROVIDER_META).forEach((key) => wireProviderCard(key, isAdmin));

    const auditArea = document.getElementById('audit-log-area');
    try {
      const logData = await apiFetch('/api/audit-log/');
      const logResults = logData.results || logData;
      auditArea.innerHTML = logResults.length ? logResults.slice(0, 50).map((e) => `
        <div class="table-row">
          <span>${escapeHtml((e.action || '').replace(/_/g, ' '))}</span>
          <span class="text-muted">${escapeHtml(e.actor_username || 'system')}</span>
          <span class="text-muted">${escapeHtml(e.target_model || '')}</span>
          <span class="text-muted" style="font-size:0.8rem;">${escapeHtml(e.description || '')}</span>
          <span class="text-muted">${timeAgo(e.created_at)}</span>
        </div>
      `).join('') : '<p class="text-muted">No activity logged yet.</p>';
    } catch (err) {
      auditArea.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    }
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

function renderProviderCard(providerKey, fieldsStatus, isAdmin) {
  const meta = PROVIDER_META[providerKey];
  const allSet = meta.fields.every((f) => fieldsStatus[f.name]?.is_set);
  const anySet = meta.fields.some((f) => fieldsStatus[f.name]?.is_set);
  const overallColor = allSet ? 'var(--color-success)' : (anySet ? 'var(--color-gold-dark)' : 'var(--color-text-muted)');
  const overallLabel = allSet ? 'Configured' : (anySet ? 'Partially configured' : 'Not configured');

  return `
    <div class="card" style="padding:var(--space-5); margin-bottom:var(--space-4);">
      <div class="flex-between" style="align-items:flex-start; margin-bottom:10px;">
        <div>
          <h4 style="margin:0 0 2px 0;">${escapeHtml(meta.label)}</h4>
          <span style="font-size:0.8rem; font-weight:700; color:${overallColor};">${overallLabel}</span>
        </div>
        ${isAdmin ? `<button class="btn btn-outline btn-sm test-connection-btn" data-provider="${providerKey}">Test connection</button>` : ''}
      </div>
      ${meta.note ? `<p class="text-muted" style="font-size:0.78rem; margin:0 0 12px 0;">${escapeHtml(meta.note)}</p>` : ''}
      <div id="test-result-${providerKey}"></div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-top:10px;">
        ${meta.fields.map((f) => {
          const fstatus = fieldsStatus[f.name] || { is_set: false, value: '', source: 'unset' };
          const currentHint = f.secret
            ? (fstatus.is_set ? `Currently: ${escapeHtml(fstatus.value)} (${fstatus.source})` : 'Not set')
            : null;
          const prefillValue = f.secret ? '' : escapeHtml(fstatus.value || '');
          return `
            <div class="form-group" style="margin-bottom:0;">
              <label style="display:flex; justify-content:space-between; align-items:center;">
                <span>${escapeHtml(f.label)}</span>
                ${isAdmin && f.secret && fstatus.is_set ? `<a href="#" class="clear-field-link text-muted" data-provider="${providerKey}" data-field="${f.name}" style="font-size:0.72rem; font-weight:600;">Clear</a>` : ''}
              </label>
              <input type="${f.secret ? 'password' : 'text'}" class="provider-field-input" data-provider="${providerKey}" data-field="${f.name}"
                     value="${prefillValue}" placeholder="${f.secret ? (fstatus.is_set ? 'Leave blank to keep current value' : 'Not set') : ''}"
                     ${!isAdmin ? 'disabled' : ''}>
              ${currentHint ? `<span class="text-muted" style="font-size:0.72rem;">${currentHint}</span>` : ''}
            </div>
          `;
        }).join('')}
      </div>
      ${isAdmin ? `
        <div id="save-alert-${providerKey}" style="margin-top:10px;"></div>
        <button class="btn btn-sm" data-provider="${providerKey}" id="save-provider-${providerKey}" style="margin-top:10px;">Save ${escapeHtml(meta.label)} settings</button>
      ` : ''}
    </div>
  `;
}

function wireProviderCard(providerKey, isAdmin) {
  if (!isAdmin) return;

  document.getElementById(`save-provider-${providerKey}`)?.addEventListener('click', async () => {
    const btn = document.getElementById(`save-provider-${providerKey}`);
    const alertBox = document.getElementById(`save-alert-${providerKey}`);
    alertBox.innerHTML = '';

    const body = {};
    document.querySelectorAll(`.provider-field-input[data-provider="${providerKey}"]`).forEach((input) => {
      if (input.value !== '') {
        body[input.dataset.field] = input.value;
      }
    });
    if (Object.keys(body).length === 0) {
      alertBox.innerHTML = `<div class="alert alert-error" style="font-size:0.8rem; padding:var(--space-2);">Nothing to save -- fill in at least one field, or use "Clear" to remove an existing value.</div>`;
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try {
      await apiFetch(`/api/integration-credentials/${providerKey}/`, { method: 'POST', body });
      alertBox.innerHTML = `<div class="alert alert-success" style="font-size:0.8rem; padding:var(--space-2);">Saved. Takes effect immediately.</div>`;
      setTimeout(() => {
        const tab = document.getElementById('tab-content');
        renderSettingsTab(tab);
      }, 1100);
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error" style="font-size:0.8rem; padding:var(--space-2);">${escapeHtml(formatApiError(err))}</div>`;
      btn.disabled = false;
      btn.textContent = `Save ${PROVIDER_META[providerKey].label} settings`;
    }
  });

  document.querySelectorAll(`.clear-field-link[data-provider="${providerKey}"]`).forEach((link) => {
    link.addEventListener('click', async (e) => {
      e.preventDefault();
      if (!confirm(`Clear the saved ${link.dataset.field.replace(/_/g, ' ')}? This reverts to the .env fallback (if any).`)) return;
      try {
        await apiFetch(`/api/integration-credentials/${providerKey}/`, { method: 'POST', body: { [link.dataset.field]: '' } });
        const tab = document.getElementById('tab-content');
        renderSettingsTab(tab);
      } catch (err) {
        alert(formatApiError(err));
      }
    });
  });

  document.querySelector(`.test-connection-btn[data-provider="${providerKey}"]`)?.addEventListener('click', async () => {
    const btn = document.querySelector(`.test-connection-btn[data-provider="${providerKey}"]`);
    const resultArea = document.getElementById(`test-result-${providerKey}`);
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span>';
    resultArea.innerHTML = '';
    try {
      const result = await apiFetch(`/api/integration-credentials/${providerKey}/test-connection/`, { method: 'POST', body: {} });
      const cls = result.success ? 'alert-success' : 'alert-error';
      resultArea.innerHTML = `<div class="alert ${cls}" style="font-size:0.82rem; padding:10px; margin-bottom:10px;">${escapeHtml(result.message)}</div>`;
    } catch (err) {
      resultArea.innerHTML = `<div class="alert alert-error" style="font-size:0.82rem; padding:10px; margin-bottom:10px;">${escapeHtml(formatApiError(err))}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });
}
async function renderReportsQueue(content) {
  try {
    const data = await apiFetch('/api/moderation/reports/queue/');
    const results = data.results || data;
    if (!results.length) {
      content.innerHTML = `<div class="empty-state"><h3>No reports filed</h3></div>`;
      return;
    }
    content.innerHTML = `
      <p class="text-muted" style="margin-bottom:14px;">Reports are resolved via the Unified Queue sub-tab (each filed report also creates a queue item).</p>
    ` + results.map((r) => `
      <div class="table-row">
        <span>${escapeHtml((r.reason || '').replace(/_/g, ' '))}</span>
        <span class="text-muted">${escapeHtml(r.details || '')}</span>
        <span class="text-muted">${timeAgo(r.created_at)}</span>
      </div>
    `).join('');
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function renderUnifiedQueue(content) {
  const priorityMap = { urgent: 'pill-rejected', high: 'pill-rejected', normal: 'pill-pending', low: 'pill-draft' };
  try {
    const data = await apiFetch('/api/moderation/queue/');
    const results = data.results || data;
    if (!results.length) {
      content.innerHTML = `<div class="empty-state"><h3>Queue is empty</h3><p>No open items.</p></div>`;
      return;
    }
    const bulkBar = `
      <div class="card" style="padding:10px 16px; margin-bottom:var(--space-3); display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem;">
          <input type="checkbox" id="queue-select-all" style="width:auto;"> Select all
        </label>
        <span class="text-muted" style="font-size:0.82rem;" id="queue-selected-count">0 selected</span>
        <button class="btn btn-sm" id="queue-bulk-resolve" disabled style="margin-left:auto;">Resolve selected</button>
        <button class="btn btn-outline btn-sm" id="queue-bulk-dismiss" disabled>Dismiss selected</button>
      </div>
      <div id="queue-bulk-alert"></div>
    `;
    content.innerHTML = bulkBar + results.map((item) => `
      <div class="card" style="padding:16px 20px; margin-bottom:10px;">
        <div class="flex-between">
          <div style="display:flex; align-items:flex-start; gap:10px;">
            <input type="checkbox" class="queue-select" data-id="${item.id}" style="width:auto; margin-top:var(--space-1);">
            <div>
              <div class="flex-between" style="justify-content:flex-start; gap:10px;">
                <strong>${escapeHtml((item.item_type || '').replace(/_/g, ' '))}</strong>
                ${pillFor(item.priority, priorityMap)}
              </div>
              <p class="text-muted" style="margin:4px 0 0 0; font-size:0.8rem;">${timeAgo(item.created_at)} &middot; ref ${item.related_object_id.slice(0,8)}</p>
            </div>
          </div>
          <div style="text-align:right;">
            <button class="btn btn-outline btn-sm queue-assign" data-id="${item.id}">Assign to me</button>
            <button class="btn btn-sm queue-resolve" data-id="${item.id}">Resolve</button>
            <button class="btn btn-ghost btn-sm queue-dismiss" data-id="${item.id}">Dismiss</button>
          </div>
        </div>
      </div>
    `).join('');

    const doAction = async (id, endpoint, body) => {
      try {
        await apiFetch(`/api/moderation/queue/${id}/${endpoint}/`, { method: 'POST', body });
        renderUnifiedQueue(content);
      } catch (err) {
        alert(formatApiError(err));
      }
    };
    content.querySelectorAll('.queue-assign').forEach((btn) => btn.addEventListener('click', () => doAction(btn.dataset.id, 'assign', {})));
    content.querySelectorAll('.queue-resolve').forEach((btn) => btn.addEventListener('click', () => doAction(btn.dataset.id, 'resolve', { status: 'resolved', resolution_notes: 'Resolved via moderation dashboard.' })));
    content.querySelectorAll('.queue-dismiss').forEach((btn) => btn.addEventListener('click', () => doAction(btn.dataset.id, 'resolve', { status: 'dismissed' })));

    const queueCheckboxes = () => Array.from(content.querySelectorAll('.queue-select'));
    const queueSelectedCount = document.getElementById('queue-selected-count');
    const queueBulkResolveBtn = document.getElementById('queue-bulk-resolve');
    const queueBulkDismissBtn = document.getElementById('queue-bulk-dismiss');
    const queueSelectAllBox = document.getElementById('queue-select-all');

    const updateQueueBulkState = () => {
      const selected = queueCheckboxes().filter((cb) => cb.checked);
      queueSelectedCount.textContent = `${selected.length} selected`;
      queueBulkResolveBtn.disabled = selected.length === 0;
      queueBulkDismissBtn.disabled = selected.length === 0;
    };
    queueCheckboxes().forEach((cb) => cb.addEventListener('change', updateQueueBulkState));
    queueSelectAllBox.addEventListener('change', () => {
      queueCheckboxes().forEach((cb) => { cb.checked = queueSelectAllBox.checked; });
      updateQueueBulkState();
    });

    const doBulkQueueAction = async (statusValue) => {
      const ids = queueCheckboxes().filter((cb) => cb.checked).map((cb) => cb.dataset.id);
      if (!ids.length) return;
      if (!confirm(`${statusValue === 'resolved' ? 'Resolve' : 'Dismiss'} ${ids.length} item(s)?`)) return;
      const alertBox = document.getElementById('queue-bulk-alert');
      alertBox.innerHTML = '';
      const body = statusValue === 'resolved' ? { status: 'resolved', resolution_notes: 'Bulk-resolved via moderation dashboard.' } : { status: 'dismissed' };
      const results = await Promise.allSettled(
        ids.map((id) => apiFetch(`/api/moderation/queue/${id}/resolve/`, { method: 'POST', body }))
      );
      const failures = results.filter((r) => r.status === 'rejected').length;
      if (failures) {
        alertBox.innerHTML = `<div class="alert alert-error">${failures} of ${ids.length} failed.</div>`;
      }
      renderUnifiedQueue(content);
    };
    queueBulkResolveBtn.addEventListener('click', () => doBulkQueueAction('resolved'));
    queueBulkDismissBtn.addEventListener('click', () => doBulkQueueAction('dismissed'));
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

/* ---------------------------------------------------------------------- */
/* SUPPORT TICKETS queue                                                  */
/* ---------------------------------------------------------------------- */

async function renderSupportQueue(content) {
  content.innerHTML = `
    <div class="field-row" style="margin-bottom:var(--space-4);">
      <select id="support-status-filter" style="padding:8px 10px; border:1px solid var(--color-border); border-radius:6px;">
        <option value="open">Open</option>
        <option value="in_progress">In progress</option>
        <option value="resolved">Resolved</option>
        <option value="closed">Closed</option>
        <option value="">All</option>
      </select>
    </div>
    <div id="support-list"><p class="text-muted"><span class="spinner"></span> Loading&hellip;</p></div>
  `;
  const statusMap = { open: 'pill-pending', in_progress: 'pill-pending', resolved: 'pill-verified', closed: 'pill-draft' };

  const load = async () => {
    const listEl = document.getElementById('support-list');
    const statusFilter = document.getElementById('support-status-filter').value;
    const params = new URLSearchParams({ all: '1' });
    if (statusFilter) params.set('status', statusFilter);
    try {
      const data = await apiFetch(`/api/support-tickets/?${params.toString()}`);
      const results = data.results || data;
      if (!results.length) {
        listEl.innerHTML = `<div class="empty-state"><h3>No tickets</h3></div>`;
        return;
      }
      listEl.innerHTML = results.map((t) => `
        <div class="card" style="padding:16px 20px; margin-bottom:10px;">
          <div class="flex-between" style="align-items:flex-start;">
            <div>
              <strong>${escapeHtml(t.subject)}</strong>
              <span class="pill pill-draft" style="margin-left:6px;">${escapeHtml((t.category || '').replace('_', ' '))}</span>
              ${pillFor(t.status, statusMap)}
              <p class="text-muted" style="margin:6px 0 0 0; font-size:0.85rem;">${escapeHtml(t.user_username)}: ${escapeHtml(t.message)}</p>
              <p class="text-muted" style="margin:4px 0 0 0; font-size:0.78rem;">${timeAgo(t.created_at)}</p>
            </div>
          </div>
          ${(t.messages || []).length ? `
            <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--color-border); display:flex; flex-direction:column; gap:6px;">
              ${t.messages.map((m) => `
                <div style="font-size:0.85rem;"><strong>${m.is_staff_reply ? 'Support' : escapeHtml(m.author_username)}:</strong> ${escapeHtml(m.message)} <span class="text-muted" style="font-size:0.72rem;">&middot; ${timeAgo(m.created_at)}</span></div>
              `).join('')}
            </div>
          ` : ''}
          <div style="margin-top:10px; display:flex; gap:8px; align-items:center;">
            <input type="text" class="support-reply-input" data-id="${t.id}" placeholder="Reply&hellip;" style="flex:1; padding:var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem;">
            <select class="support-reply-status" data-id="${t.id}" style="padding:var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem;">
              <option value="">Keep status</option>
              <option value="in_progress">Mark in progress</option>
              <option value="resolved">Mark resolved</option>
              <option value="closed">Close</option>
            </select>
            <button class="btn btn-sm support-reply-btn" data-id="${t.id}">Send</button>
          </div>
        </div>
      `).join('');

      listEl.querySelectorAll('.support-reply-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const message = document.querySelector(`.support-reply-input[data-id="${id}"]`).value.trim();
          const statusValue = document.querySelector(`.support-reply-status[data-id="${id}"]`).value;
          if (!message) return;
          btn.disabled = true;
          try {
            const body = { message };
            if (statusValue) body.status = statusValue;
            await apiFetch(`/api/support-tickets/${id}/reply/`, { method: 'POST', body });
            load();
          } catch (err) {
            alert(formatApiError(err));
            btn.disabled = false;
          }
        });
      });
    } catch (err) {
      listEl.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    }
  };

  document.getElementById('support-status-filter').addEventListener('change', load);
  load();
}

async function renderFinancialsTab(content) {
  content.innerHTML = `
    <div class="field-row" style="margin-bottom:var(--space-4); align-items:flex-end;">
      <div class="form-group" style="margin-bottom:0;">
        <label for="fin-period">Period</label>
        <select id="fin-period">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly" selected>Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>
      <button class="btn btn-outline btn-sm" id="fin-export-link" style="margin-bottom:2px;">Export CSV</button>
      <button class="btn btn-outline btn-sm" id="fin-export-pdf-link" style="margin-bottom:2px;">Export PDF</button>
    </div>
    <div id="fin-summary"></div>
    <div id="fin-table"><p class="text-muted"><span class="spinner"></span> Loading&hellip;</p></div>
  `;

  document.getElementById('fin-export-link').addEventListener('click', (e) => {
    const period = document.getElementById('fin-period').value;
    downloadAuthenticated(`/api/payments/reports/export/?period=${period}`, `wemix-financial-report-${period}.csv`, e.currentTarget);
  });
  document.getElementById('fin-export-pdf-link').addEventListener('click', (e) => {
    const period = document.getElementById('fin-period').value;
    downloadAuthenticated(`/api/payments/reports/export-pdf/?period=${period}`, `wemix-financial-report-${period}.pdf`, e.currentTarget);
  });

  const load = async () => {
    const period = document.getElementById('fin-period').value;
    try {
      const data = await apiFetch(`/api/payments/reports/?period=${period}`);
      const maxSales = Math.max(1, ...data.results.map((r) => Number(r.gross_sales)));

      document.getElementById('fin-summary').innerHTML = `
        <div class="scoreboard" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:var(--space-5);">
          <div class="card" style="padding:14px;"><p class="text-muted" style="margin:0; font-size:0.78rem;">Gross sales</p><div style="font-size:1.3rem; font-weight:700;">${money(data.totals.gross_sales)}</div></div>
          <div class="card" style="padding:14px;"><p class="text-muted" style="margin:0; font-size:0.78rem;">Platform commission</p><div style="font-size:1.3rem; font-weight:700;">${money(data.totals.platform_commission)}</div></div>
          <div class="card" style="padding:14px;"><p class="text-muted" style="margin:0; font-size:0.78rem;">Orders</p><div style="font-size:1.3rem; font-weight:700;">${data.totals.order_count}</div></div>
          <div class="card" style="padding:14px;"><p class="text-muted" style="margin:0; font-size:0.78rem;">Refunded</p><div style="font-size:1.3rem; font-weight:700;">${money(data.totals.refunded_amount)}</div></div>
        </div>
      `;

      document.getElementById('fin-table').innerHTML = data.results.length ? `
        <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:var(--space-5);">
          ${data.results.map((r) => `
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="text-muted mono" style="width:110px; font-size:0.78rem;">${escapeHtml(r.period)}</span>
              <div style="flex:1; background:var(--color-bg-alt); border-radius:4px; overflow:hidden; height:18px;">
                <div style="width:${(Number(r.gross_sales) / maxSales) * 100}%; background:var(--color-gold); height:100%;"></div>
              </div>
              <span style="width:120px; text-align:right; font-size:0.82rem;">${money(r.gross_sales)}</span>
            </div>
          `).join('')}
        </div>
        ${data.results.map((r) => `
          <div class="table-row">
            <span>${escapeHtml(r.period)}</span>
            <span>${money(r.gross_sales)}</span>
            <span class="text-muted">commission: ${money(r.platform_commission)}</span>
            <span class="text-muted">${r.order_count} order(s)</span>
            <span class="text-muted">refunded: ${money(r.refunded_amount)}</span>
          </div>
        `).join('')}
      ` : '<p class="text-muted">No paid orders in this range yet.</p>';
    } catch (err) {
      document.getElementById('fin-table').innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    }
  };

  document.getElementById('fin-period').addEventListener('change', load);
  load();
}

init();
