<title>Moderation — Habari Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<main class="container section" id="gate">
  <p class="text-muted"><span class="spinner"></span> Loading&hellip;</p>

<script>
if (!Auth.isLoggedIn()) {
  window.location.href = 'login.html';
}

const gate = document.getElementById('gate');
const STAFF_ROLES = ['moderator', 'admin', 'super_admin'];
const ADMIN_ROLES = ['admin', 'super_admin'];
let CURRENT_USER = null;

/* Downloads a JWT-gated endpoint's response as a file -- a plain <a href>
   to an authenticated API URL doesn't carry the Bearer token, so file
   downloads need a real fetch + blob + object-URL click, same pattern as
   listing.html's media download. */
async function downloadAuthenticated(path, defaultFilename, btn) {
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    const resp = await fetch(`${API_BASE_URL}${path}`, {
      headers: { Authorization: `Bearer ${Auth.getAccessToken()}` },
    });
    if (!resp.ok) throw new Error(`Download failed (HTTP ${resp.status}).`);
    const blob = await resp.blob();
    const disposition = resp.headers.get('Content-Disposition') || '';
    const match = disposition.match(/filename="?([^"]+)"?/);
    const filename = match ? match[1] : defaultFilename;
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
  } catch (err) {
    alert(err.message || 'Download failed.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}

function pillFor(status, map) {
  return `<span class="pill ${map[status] || 'pill-draft'}">${escapeHtml((status || '').replace(/_/g, ' '))}</span>`;
}

/* Generic modal dialog helper. Reuses a single overlay element in the DOM
   (created lazily) so only one modal is ever open at a time. */
function openModal(titleHtml, bodyHtml) {
  let overlay = document.getElementById('global-modal-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'global-modal-overlay';
    overlay.className = 'modal-overlay hidden';
    overlay.innerHTML = `
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 style="margin:0;" id="global-modal-title"></h3>
          <button class="modal-close-btn" id="global-modal-close" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" id="global-modal-body"></div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('global-modal-close').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  }
  document.getElementById('global-modal-title').innerHTML = titleHtml;
  document.getElementById('global-modal-body').innerHTML = bodyHtml;
  overlay.classList.remove('hidden');
  return document.getElementById('global-modal-body');
}

function closeModal() {
  const overlay = document.getElementById('global-modal-overlay');
  if (overlay) overlay.classList.add('hidden');
}

/* Generic sub-tab bar helper: tabs = [{key, label, render}], renders into subContentEl */
function renderSubTabs(container, tabs, defaultKey) {
  const barId = `subtabs-${Math.random().toString(36).slice(2, 8)}`;
  container.innerHTML = `
    <div class="sub-tabs" id="${barId}">
      ${tabs.map((t) => `<button class="sub-tab ${t.key === defaultKey ? 'active' : ''}" data-subtab="${t.key}">${escapeHtml(t.label)}</button>`).join('')}
    </div>
    <div class="sub-content"></div>
  `;
  const bar = document.getElementById(barId);
  const subContent = container.querySelector('.sub-content');

  const activate = (key) => {
    bar.querySelectorAll('.sub-tab').forEach((b) => b.classList.toggle('active', b.dataset.subtab === key));
    subContent.innerHTML = `<p class="text-muted"><span class="spinner"></span> Loading&hellip;</p>`;
    const tab = tabs.find((t) => t.key === key);
    if (tab) tab.render(subContent);
  };

  bar.querySelectorAll('.sub-tab').forEach((btn) => {
    btn.addEventListener('click', () => activate(btn.dataset.subtab));
  });
  activate(defaultKey);
}

async function init() {
  let me;
  try {
    me = await apiFetch('/api/accounts/me/');
  } catch (err) {
    gate.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    return;
  }
  if (!STAFF_ROLES.includes(me.role)) {
    gate.innerHTML = `<div class="empty-state"><h3>Moderator access required</h3><p>Your account (${escapeHtml(me.role)}) doesn't have moderation permissions.</p></div>`;
    return;
  }
  CURRENT_USER = me;

  gate.innerHTML = `
    <h1 style="margin-bottom:var(--space-1);">Moderation</h1>
    <p class="text-muted" style="margin-top:0;">Signed in as ${escapeHtml(me.username)} (${escapeHtml(me.role)})</p>
    <div class="dash-tabs">
      <div class="dash-tab active" data-tab="verifications">Verifications</div>
      <div class="dash-tab" data-tab="users">Users</div>
      <div class="dash-tab" data-tab="listings">Listings</div>
      <div class="dash-tab" data-tab="transactions">Transactions</div>
      ${ADMIN_ROLES.includes(me.role) ? `<div class="dash-tab" data-tab="treasury">Treasury</div>` : ''}
      <div class="dash-tab" data-tab="settings">Settings</div>
      <div class="dash-tab" data-tab="reports">Reports</div>
    </div>
    <div id="tab-content"></div>
  `;

  document.querySelectorAll('.dash-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.dash-tab').forEach((t) => t.classList.remove('active'));
      tab.classList.add('active');
      renderTab(tab.dataset.tab);
    });
  });

  renderTab('verifications');
}

function renderTab(tab) {
  const content = document.getElementById('tab-content');
  if (tab === 'verifications') {
    return renderSubTabs(content, [
      { key: 'kyc', label: 'Identity (KYC)', render: renderVerificationQueue },
      { key: 'listings', label: 'Listings & AI score', render: renderListingVerificationQueue },
      { key: 'payout', label: 'Payout accounts', render: renderPayoutAccountsQueue },
      { key: 'corporate', label: 'Corporate (KYB)', render: renderCorporateQueue },
    ], 'kyc');
  }
  if (tab === 'users') return renderUsersTab(content);
  if (tab === 'listings') {
    return renderSubTabs(content, [
      { key: 'all', label: 'All listings', render: renderAllListings },
      { key: 'flags', label: 'Circumvention flags', render: renderFlagsQueue },
    ], 'all');
  }
  if (tab === 'transactions') {
    return renderSubTabs(content, [
      { key: 'sales', label: 'Sales', render: renderSalesTab },
      { key: 'refunds', label: 'Refunds', render: renderRefundsQueue },
      { key: 'withdrawals', label: 'Withdrawals', render: renderWithdrawalsQueue },
      { key: 'subscriptions', label: 'Subscriptions', render: renderSubscriptionsTab },
      { key: 'payout', label: 'Payout accounts', render: renderPayoutAccountsQueue },
      { key: 'wallet', label: 'Platform wallet & commissions', render: renderPlatformWallet },
    ], 'sales');
  }
  if (tab === 'treasury') return renderTreasuryTab(content);
  if (tab === 'settings') return renderSettingsTab(content);
  if (tab === 'reports') {
    return renderSubTabs(content, [
      { key: 'reports', label: 'User reports', render: renderReportsQueue },
      { key: 'queue', label: 'Unified queue', render: renderUnifiedQueue },
      { key: 'support', label: 'Support tickets', render: renderSupportQueue },
      { key: 'financials', label: 'Financials', render: renderFinancialsTab },
    ], 'reports');
  }
}

/* VERIFICATIONS tab                                                       */

async function renderVerificationQueue(content) {
  try {
    const data = await apiFetch('/api/accounts/kyc/queue/');
    const results = data.results || data;
    if (!results.length) {
      content.innerHTML = `<div class="empty-state"><h3>Nothing pending</h3><p>No identity verifications awaiting review.</p></div>`;
      return;
    }
    content.innerHTML = results.map((v) => `
      <div class="card" style="padding:var(--space-5); margin-bottom:14px;">
        <div class="flex-between" style="align-items:flex-start;">
          <div>
            <h3 style="margin:0 0 4px 0;">${escapeHtml((v.id_type || '').toUpperCase())} submission</h3>
            <p class="text-muted" style="margin:0 0 10px 0; font-size:0.85rem;">Submitted ${timeAgo(v.created_at)}</p>
            <div style="display:flex; gap:10px; margin-bottom:var(--space-3);">
              <a href="${v.front_image}" target="_blank"><img src="${v.front_image}" alt="ID front" style="width:120px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--color-border);"></a>
              <a href="${v.selfie_image}" target="_blank"><img src="${v.selfie_image}" alt="Selfie" style="width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--color-border);"></a>
            </div>
            <p style="font-size:0.85rem; margin:2px 0;"><strong>OCR name:</strong> ${escapeHtml(v.ocr_full_name || '—')}</p>
            <p style="font-size:0.85rem; margin:2px 0;"><strong>OCR ID number:</strong> ${escapeHtml(v.ocr_id_number || '—')}</p>
            <p style="font-size:0.85rem; margin:2px 0;"><strong>OCR DOB:</strong> ${escapeHtml(v.ocr_date_of_birth || '—')}</p>
            <p style="font-size:0.85rem; margin:2px 0;"><strong>OCR confidence:</strong> ${v.ocr_confidence != null ? Math.round(v.ocr_confidence * 100) + '%' : '—'}</p>
          </div>
          <div style="min-width:220px;">
            <div id="kyc-alert-${v.id}"></div>
            <button class="btn btn-sm btn-block kyc-approve" data-id="${v.id}" style="margin-bottom:var(--space-2);">Approve</button>
            <input type="text" class="kyc-reason" data-id="${v.id}" placeholder="Rejection reason" style="width:100%; margin-bottom:var(--space-2); padding:var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem;">
            <button class="btn btn-outline btn-sm btn-block kyc-reject" data-id="${v.id}">Reject</button>
          </div>
        </div>
      </div>
    `).join('');

    const doReview = async (id, status) => {
      const alertBox = document.getElementById(`kyc-alert-${id}`);
      const reason = document.querySelector(`.kyc-reason[data-id="${id}"]`)?.value || '';
      alertBox.innerHTML = '';
      try {
        await apiFetch(`/api/accounts/kyc/${id}/review/`, {
          method: 'PATCH', body: { status, rejection_reason: reason },
        });
        renderVerificationQueue(content);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
      }
    };
    content.querySelectorAll('.kyc-approve').forEach((btn) => btn.addEventListener('click', () => doReview(btn.dataset.id, 'verified')));
    content.querySelectorAll('.kyc-reject').forEach((btn) => btn.addEventListener('click', () => doReview(btn.dataset.id, 'rejected')));
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

function renderListingFullDetails(listing) {
  const ai = listing.latest_ai_verification;
  const scoreRow = (label, value, inverse = false) => {
    if (value == null) return '';
    const good = inverse ? value < 30 : value > 70;
    const bad = inverse ? value > 70 : value < 30;
    const color = good ? 'var(--color-success)' : (bad ? 'var(--color-danger)' : 'var(--color-gold-dark)');
    return `<div class="table-row" style="grid-template-columns: 1fr auto;"><span>${label}</span><span style="color:${color}; font-weight:700;">${value}</span></div>`;
  };

  const mediaHtml = (listing.media || []).length
    ? `<div style="display:flex; gap:10px; flex-wrap:wrap; margin:10px 0;">
        ${listing.media.map((m) => {
          const src = m.file || m.preview_file;
          const filename = (src || '').split('/').pop();
          let previewHtml;
          if (m.media_type === 'video') {
            previewHtml = `<video src="${src}" controls preload="metadata" style="width:140px;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--color-border);background:#000;"></video>`;
          } else if (m.media_type === 'document') {
            previewHtml = `
              <a href="${src}" target="_blank" rel="noopener" style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100px; height:70px; border-radius:6px; border:1px solid var(--color-border); background:#f6f3ea; text-decoration:none; color:var(--color-text);">
                <span style="font-size:1.4rem;">📄</span>
                <span class="text-muted" style="font-size:0.65rem; padding:0 4px; word-break:break-all;">${escapeHtml(filename)}</span>
              </a>`;
          } else {
            previewHtml = `<img src="${m.preview_file || m.file}" alt="" class="mod-media-zoom" data-full="${src}" style="width:100px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--color-border);cursor:zoom-in;">`;
          }
          const wireBits = [];
          if (m.credit_line) wireBits.push(escapeHtml(m.credit_line));
          if (m.capture_date) wireBits.push(new Date(m.capture_date).toLocaleDateString());
          if (m.gps_latitude != null && m.gps_longitude != null) wireBits.push(`${m.gps_latitude}, ${m.gps_longitude}`);
          if (m.keywords) wireBits.push(escapeHtml(m.keywords));
          return `
          <div style="text-align:center; max-width:110px;">
            ${previewHtml}
            <div class="text-muted" style="font-size:0.65rem; margin-top:2px; text-transform:uppercase; letter-spacing:0.03em;">${escapeHtml(m.media_type)}${m.is_cover ? ' &middot; cover' : ''}</div>
            ${m.media_type !== 'image' ? `<a href="${src}" download class="text-muted" style="font-size:0.7rem;">Download</a>` : ''}
            ${(m.analysis_results || []).map((a) => `<div class="text-muted" style="font-size:0.7rem; margin-top:2px;">${a.flagged ? '<span style="color:var(--color-danger);">⚠ flagged</span>' : 'clean'} &middot; manip. ${a.manipulation_score}</div>`).join('')}
            ${wireBits.length ? `<div class="text-muted" style="font-size:0.62rem; margin-top:var(--space-1); line-height:1.3;">${wireBits.join('<br>')}</div>` : ''}
          </div>
        `;
        }).join('')}
      </div>`
    : '<p class="text-muted" style="font-size:0.85rem;">No media attached.</p>';

  const tagsHtml = (listing.tags || []).length
    ? listing.tags.map((t) => `<span class="pill pill-draft" style="margin-right:var(--space-1);">${escapeHtml(t.name)}</span>`).join('')
    : '<span class="text-muted">none</span>';

  return `
    <p style="font-size:0.8rem; display:flex; align-items:center; gap:8px;">
      <strong>Seller:</strong> ${escapeHtml(listing.seller_username)} ${listing.seller_verified_badge ? '<span style="color:var(--color-gold-dark);">&#10003; verified</span>' : ''}
      <button class="btn btn-outline btn-sm toggle-verified-badge-btn" data-user-id="${listing.seller}" style="padding:2px 8px; font-size:0.75rem;">${listing.seller_verified_badge ? 'Remove verified badge' : 'Grant verified badge'}</button>
    </p>
    <p style="font-size:0.8rem;"><strong>Location:</strong> ${escapeHtml(listing.location || 'n/a')} &middot; <strong>Tags:</strong> ${tagsHtml}</p>
    <p style="font-size:0.8rem;"><strong>License:</strong> ${escapeHtml((listing.license_type || 'standard').replace(/_/g, ' '))} &middot; <strong>Territory:</strong> ${escapeHtml(listing.license_territory || 'Worldwide')}</p>
    <p style="font-size:0.85rem; font-weight:600; margin-bottom:var(--space-1);">Full story body:</p>
    <div class="card" style="padding:14px; background:#f6f3ea; margin-bottom:14px;">
      <p style="white-space:pre-wrap; font-size:0.85rem; margin:0;">${escapeHtml(listing.body || '(empty)')}</p>
    </div>
    <p style="font-size:0.85rem; font-weight:600; margin-bottom:var(--space-1);">Attached media:</p>
    ${mediaHtml}
    ${ai ? `
      <p style="font-size:0.85rem; font-weight:600; margin-bottom:var(--space-1);">AI verification breakdown (run ${timeAgo(ai.created_at)}, model: ${escapeHtml(ai.model_name || 'n/a')}):</p>
      <div style="margin-bottom:var(--space-2);">
        ${scoreRow('Fake news score (higher = more likely fake)', ai.fake_news_score, true)}
        ${scoreRow('Misinformation score', ai.misinformation_score, true)}
        ${scoreRow('Clickbait score', ai.clickbait_score, true)}
        ${scoreRow('Authenticity score', ai.authenticity_score, false)}
        ${scoreRow('Similarity to existing content', ai.similarity_score, true)}
        ${scoreRow('Overall risk score', ai.risk_score, true)}
        ${scoreRow('Model confidence', ai.confidence_score, false)}
        <div class="table-row" style="grid-template-columns: 1fr auto;"><span>Sentiment</span><span>${ai.sentiment_score}</span></div>
      </div>
      ${ai.human_notes ? `<p class="text-muted" style="font-size:0.8rem;"><strong>Prior human notes:</strong> ${escapeHtml(ai.human_notes)}</p>` : ''}
    ` : '<p class="text-muted" style="font-size:0.85rem;">No AI verification result recorded.</p>'}
    <p style="font-size:0.85rem; font-weight:600; margin:14px 0 4px 0;">Corrections &amp; retractions:</p>
    ${(listing.corrections || []).length ? listing.corrections.map((c) => `
      <div class="card" style="padding:10px 14px; margin-bottom:var(--space-2); ${c.is_retraction ? 'border-color:var(--color-danger);' : ''}">
        <p style="margin:0; font-size:0.82rem;">${c.is_retraction ? '<strong style="color:var(--color-danger);">RETRACTION</strong>' : '<strong>Correction</strong>'} <span class="text-muted">&middot; ${escapeHtml(c.created_by_username || 'staff')} &middot; ${timeAgo(c.created_at)}</span></p>
        <p style="margin:4px 0 0 0; font-size:0.85rem;">${escapeHtml(c.text)}</p>
      </div>
    `).join('') : '<p class="text-muted" style="font-size:0.85rem;">None posted.</p>'}
    <div style="margin-top:var(--space-2);">
      <textarea class="correction-text" placeholder="Correction or retraction text&hellip;" style="width:100%; padding:var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem; min-height:50px;"></textarea>
      <label style="display:flex; align-items:center; gap:6px; font-size:0.8rem; margin:6px 0;">
        <input type="checkbox" class="correction-is-retraction" style="width:auto;"> This is a retraction (materially wrong, not just an amendment)
      </label>
      <div id="correction-alert-${listing.slug}"></div>
      <button class="btn btn-outline btn-sm correction-post-btn" data-slug="${listing.slug}">Post correction</button>
    </div>
  `;
}

function wireCorrectionForm(panel, slug, onDone) {
  const btn = panel.querySelector('.correction-post-btn');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const text = panel.querySelector('.correction-text')?.value.trim();
    const isRetraction = panel.querySelector('.correction-is-retraction')?.checked || false;
    const alertBox = document.getElementById(`correction-alert-${slug}`);
    alertBox.innerHTML = '';
    if (!text) {
      alertBox.innerHTML = `<div class="alert alert-error">Correction text is required.</div>`;
      return;
    }
    btn.disabled = true;
    try {
      await apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/corrections/`, { method: 'POST', body: { text, is_retraction: isRetraction } });
      if (onDone) await onDone();
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
      btn.disabled = false;
    }
  });
}

function wireVerifiedBadgeButton(panel, onDone) {
  const badgeBtn = panel.querySelector('.toggle-verified-badge-btn');
  if (!badgeBtn) return;
  badgeBtn.addEventListener('click', async () => {
    badgeBtn.disabled = true;
    try {
      await apiFetch(`/api/accounts/users/${encodeURIComponent(badgeBtn.dataset.userId)}/toggle-verified-badge/`, { method: 'POST' });
      if (onDone) await onDone();
    } catch (err) {
      alert(formatApiError(err));
      badgeBtn.disabled = false;
    }
  });
}

function wireMediaZoom(panel) {
  panel.querySelectorAll('.mod-media-zoom').forEach((img) => {
    img.addEventListener('click', () => {
      openModal('Image preview', `<img src="${img.dataset.full}" alt="" style="max-width:100%; max-height:70vh; display:block; margin:0 auto; border-radius:6px;">`);
    });
  });
}

function deletePermanentlyHtml(slug) {
  return `
    <div style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--color-danger);">
      <div id="delete-perm-alert-${slug}"></div>
      <button class="btn btn-outline btn-sm mod-delete-permanently" data-slug="${slug}" style="border-color:var(--color-danger); color:var(--color-danger);">Delete Permanently</button>
    </div>
  `;
}

function wireDeletePermanentlyButton(panel, slug, onDone) {
  const btn = panel.querySelector('.mod-delete-permanently');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const alertBox = document.getElementById(`delete-perm-alert-${slug}`);
    if (!confirm('Permanently delete this listing? This action cannot be undone.')) return;
    const reason = prompt('Reason for permanent deletion (required):');
    if (!reason || !reason.trim()) return;
    btn.disabled = true;
    try {
      await apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/delete-permanently/`, { method: 'POST', body: { reason } });
      if (onDone) onDone();
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
      btn.disabled = false;
    }
  });
}

async function renderListingVerificationQueue(content) {
  const verificationMap = {
    verified: 'pill-verified', partially_verified: 'pill-pending',
    needs_human_review: 'pill-pending', pending: 'pill-draft', rejected: 'pill-rejected',
  };
  try {
    const data = await apiFetch('/api/news/listings/?queue=1');
    const results = data.results || data;
    if (!results.length) {
      content.innerHTML = `<div class="empty-state"><h3>Queue is empty</h3><p>No listings are currently awaiting a verification decision.</p></div>`;
      return;
    }
    const bulkBar = `
      <div class="card" style="padding:10px 16px; margin-bottom:var(--space-3); display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem;">
          <input type="checkbox" id="listmod-select-all" style="width:auto;"> Select all
        </label>
        <span class="text-muted" style="font-size:0.82rem;" id="listmod-selected-count">0 selected</span>
        <button class="btn btn-sm" id="listmod-bulk-approve" disabled style="margin-left:auto;">Approve &amp; publish selected</button>
        <button class="btn btn-outline btn-sm" id="listmod-bulk-reject" disabled>Reject selected</button>
      </div>
      <div id="listmod-bulk-alert"></div>
    `;
    content.innerHTML = bulkBar + results.map((l) => {
      const scoreColor = l.ai_score == null ? 'var(--color-text-muted)' : (l.ai_score >= 70 ? 'var(--color-success)' : (l.ai_score >= 40 ? 'var(--color-gold-dark)' : 'var(--color-danger)'));
      return `
      <div class="card" style="padding:18px 20px; margin-bottom:var(--space-3);">
        <div class="flex-between" style="align-items:flex-start;">
          <div>
            <div class="flex-between" style="justify-content:flex-start; gap:10px;">
              <input type="checkbox" class="listmod-select" data-slug="${l.slug}" style="width:auto;">
              <strong>${escapeHtml(l.title)}</strong>
              ${pillFor(l.verification_status, verificationMap)}
            </div>
            <p class="text-muted" style="margin:6px 0; font-size:0.85rem;">${escapeHtml(l.seller_username)} &middot; ${escapeHtml((l.news_type || '').replace('_', ' '))} &middot; ${money(l.price, l.currency)}</p>
            <p style="margin:6px 0; font-size:0.85rem;">${escapeHtml(l.description)}</p>
            <p style="margin:4px 0; font-size:0.85rem;">
              <strong>AI authenticity score:</strong>
              <span style="color:${scoreColor}; font-weight:700;">${l.ai_score != null ? l.ai_score : 'n/a'}</span>
              <span class="text-muted">(higher = more likely genuine; lower = more likely fake news)</span>
            </p>
            <a href="listing.html?slug=${encodeURIComponent(l.slug)}" target="_blank" class="text-muted" style="font-size:0.8rem;">Open public listing page &rarr;</a>
            &middot;
            <a href="#" class="listmod-toggle-details text-muted" data-slug="${l.slug}" style="font-size:0.8rem; color:var(--color-gold-dark); font-weight:600;">View full details &darr;</a>
            <div class="listmod-details hidden" id="listmod-details-${l.slug}" style="margin-top:var(--space-3); padding-top:var(--space-3); border-top:1px solid var(--color-border);"></div>
          </div>
          <div style="min-width:200px;">
            <div id="listmod-alert-${l.slug}"></div>
            <textarea class="listmod-notes" data-slug="${l.slug}" placeholder="Notes (optional)" style="width:100%; margin-bottom:var(--space-2); padding:var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem; min-height:50px;"></textarea>
            <button class="btn btn-sm btn-block listmod-approve" data-slug="${l.slug}" style="margin-bottom:6px;">Approve &amp; publish</button>
            <button class="btn btn-outline btn-sm btn-block listmod-reject" data-slug="${l.slug}">Reject</button>
          </div>
        </div>
      </div>
    `;
    }).join('');

    content.querySelectorAll('.listmod-toggle-details').forEach((link) => {
      const slug = link.dataset.slug;
      const panel = document.getElementById(`listmod-details-${slug}`);

      const loadDetails = async () => {
        panel.innerHTML = `<p class="text-muted"><span class="spinner"></span> Loading&hellip;</p>`;
        try {
          const listing = await apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/`);
          panel.innerHTML = renderListingFullDetails(listing) + deletePermanentlyHtml(slug);
          panel.dataset.loaded = '1';
          wireVerifiedBadgeButton(panel, loadDetails);
          wireMediaZoom(panel);
          wireCorrectionForm(panel, slug, loadDetails);
          wireDeletePermanentlyButton(panel, slug, () => renderListingVerificationQueue(content));
        } catch (err) {
          panel.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
        }
      };

      link.addEventListener('click', async (e) => {
        e.preventDefault();
        const isHidden = panel.classList.contains('hidden');
        if (isHidden) {
          panel.classList.remove('hidden');
          link.innerHTML = 'Hide full details &uarr;';
          if (!panel.dataset.loaded) await loadDetails();
        } else {
          panel.classList.add('hidden');
          link.innerHTML = 'View full details &darr;';
        }
      });
    });

    const doModerate = async (slug, decision) => {
      const alertBox = document.getElementById(`listmod-alert-${slug}`);
      const notes = document.querySelector(`.listmod-notes[data-slug="${slug}"]`)?.value || '';
      alertBox.innerHTML = '';
      try {
        await apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/moderate/`, { method: 'POST', body: { decision, notes } });
        renderListingVerificationQueue(content);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
      }
    };
    content.querySelectorAll('.listmod-approve').forEach((btn) => btn.addEventListener('click', () => doModerate(btn.dataset.slug, 'approve')));
    content.querySelectorAll('.listmod-reject').forEach((btn) => btn.addEventListener('click', () => doModerate(btn.dataset.slug, 'reject')));

    /* Bulk actions: selecting checkboxes enables the toolbar buttons,
       which fire the same per-listing /moderate/ endpoint concurrently
       for every selected slug -- no new bulk API needed. */
    const checkboxes = () => Array.from(content.querySelectorAll('.listmod-select'));
    const selectedCount = document.getElementById('listmod-selected-count');
    const bulkApproveBtn = document.getElementById('listmod-bulk-approve');
    const bulkRejectBtn = document.getElementById('listmod-bulk-reject');
    const selectAllBox = document.getElementById('listmod-select-all');

    const updateBulkState = () => {
      const selected = checkboxes().filter((cb) => cb.checked);
      selectedCount.textContent = `${selected.length} selected`;
      bulkApproveBtn.disabled = selected.length === 0;
      bulkRejectBtn.disabled = selected.length === 0;
    };
    checkboxes().forEach((cb) => cb.addEventListener('change', updateBulkState));
    selectAllBox.addEventListener('change', () => {
      checkboxes().forEach((cb) => { cb.checked = selectAllBox.checked; });
      updateBulkState();
    });

    const doBulkModerate = async (decision) => {
      const slugs = checkboxes().filter((cb) => cb.checked).map((cb) => cb.dataset.slug);
      if (!slugs.length) return;
      if (!confirm(`${decision === 'approve' ? 'Approve & publish' : 'Reject'} ${slugs.length} listing(s)?`)) return;
      const alertBox = document.getElementById('listmod-bulk-alert');
      alertBox.innerHTML = '';
      bulkApproveBtn.disabled = true;
      bulkRejectBtn.disabled = true;
      const results = await Promise.allSettled(
        slugs.map((slug) => apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/moderate/`, { method: 'POST', body: { decision, notes: 'Bulk action.' } }))
      );
      const failures = results.filter((r) => r.status === 'rejected').length;
      if (failures) {
        alertBox.innerHTML = `<div class="alert alert-error">${failures} of ${slugs.length} failed. Check individual listings for details.</div>`;
      }
      renderListingVerificationQueue(content);
    };
    bulkApproveBtn.addEventListener('click', () => doBulkModerate('approve'));
    bulkRejectBtn.addEventListener('click', () => doBulkModerate('reject'));
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function renderPayoutAccountsQueue(content) {
  try {
    const data = await apiFetch('/api/wallet/payout-accounts/queue/');
    const results = data.results || data;
    if (!results.length) {
      content.innerHTML = `<div class="empty-state"><h3>No pending payout accounts</h3><p>Nothing awaiting verification.</p></div>`;
      return;
    }
    content.innerHTML = results.map((a) => `
      <div class="card" style="padding:16px 20px; margin-bottom:10px;">
        <div class="flex-between" style="align-items:flex-start;">
          <div>
            <strong>${escapeHtml(a.account_name)}</strong>
            ${a.name_match_score != null ? (a.name_match_score < 70
              ? `<span class="pill pill-rejected" title="Fuzzy match against the user's verified KYC name">&#9888; name match ${a.name_match_score}%</span>`
              : `<span class="pill pill-verified" title="Fuzzy match against the user's verified KYC name">name match ${a.name_match_score}%</span>`) : ''}
            <p style="margin:4px 0; font-size:0.85rem;">${escapeHtml(a.provider || a.account_type.replace('_', ' '))} &middot; ${escapeHtml(a.account_number)}</p>
            <p class="text-muted" style="font-size:0.8rem; margin:0;">${escapeHtml(a.account_type.replace('_', ' '))} &middot; ${timeAgo(a.created_at)}</p>
          </div>
          <div style="min-width:200px;">
            <div id="payout-mod-alert-${a.id}"></div>
            <button class="btn btn-sm btn-block payout-mod-verify" data-id="${a.id}" style="margin-bottom:6px;">Verify</button>
            <input type="text" class="payout-mod-reason" data-id="${a.id}" placeholder="Rejection reason" style="width:100%; margin-bottom:6px; padding:var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem;">
            <button class="btn btn-outline btn-sm btn-block payout-mod-reject" data-id="${a.id}">Reject</button>
          </div>
        </div>
      </div>
    `).join('');

    const doReview = async (id, status, extra = {}) => {
      const alertBox = document.getElementById(`payout-mod-alert-${id}`);
      alertBox.innerHTML = '';
      try {
        await apiFetch(`/api/wallet/payout-accounts/${id}/review/`, { method: 'POST', body: { status, ...extra } });
        renderPayoutAccountsQueue(content);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
      }
    };
    content.querySelectorAll('.payout-mod-verify').forEach((btn) => btn.addEventListener('click', () => doReview(btn.dataset.id, 'verified')));
    content.querySelectorAll('.payout-mod-reject').forEach((btn) => {
      btn.addEventListener('click', () => {
        const reason = document.querySelector(`.payout-mod-reason[data-id="${btn.dataset.id}"]`)?.value || '';
        doReview(btn.dataset.id, 'rejected', { rejection_reason: reason });
      });
    });
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

    } catch (err) {
      body.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;

}

      </div>
      <div class="hidden" id="user-apikeys-panel" style="margin-top:14px; padding-top:14px; border-top:1px solid var(--color-border);"></div>
      ${editFormHtml}
    `}
  `;

  if (isSelf) return;

  const afterChange = () => { refresh(); if (onListChange) onListChange(); };

  document.getElementById('user-mod-apply').addEventListener('click', async () => {
    const action = document.getElementById('user-mod-action').value;
    const alertBox = document.getElementById('user-mod-alert');
    alertBox.innerHTML = '';
    try {
      await apiFetch(`/api/accounts/users/${encodeURIComponent(u.id)}/moderate/`, { method: 'POST', body: { action } });
      afterChange();
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    }
  });

  document.getElementById('user-toggle-badge').addEventListener('click', async () => {
    try {
      await apiFetch(`/api/accounts/users/${encodeURIComponent(u.id)}/toggle-verified-badge/`, { method: 'POST' });
      afterChange();
    } catch (err) {
      alert(formatApiError(err));
    }
  });

  const apiKeysPanel = document.getElementById('user-apikeys-panel');
  const loadApiKeys = async () => {
    apiKeysPanel.innerHTML = `<p class="text-muted"><span class="spinner"></span> Loading&hellip;</p>`;
    try {
      const keys = await apiFetch(`/api/accounts/users/${encodeURIComponent(u.id)}/api-keys/`);
      apiKeysPanel.innerHTML = keys.length
        ? keys.map((k) => `
          <div class="table-row" style="grid-template-columns: 1fr auto auto auto;">
            <span>${escapeHtml(k.name)} <span class="text-muted">(${escapeHtml(k.prefix)}&hellip;)</span></span>
            <span class="text-muted">${k.last_used_at ? `used ${timeAgo(k.last_used_at)}` : 'never used'}</span>
            <span>${k.is_active ? '<span class="pill pill-verified">active</span>' : '<span class="pill pill-rejected">revoked</span>'}</span>
            <span>${k.is_active ? `<button class="btn btn-outline btn-sm apikey-revoke-btn" data-id="${k.id}">Revoke</button>` : ''}</span>
          </div>
        `).join('')
        : '<p class="text-muted" style="font-size:0.85rem;">No API keys issued.</p>';
      apiKeysPanel.querySelectorAll('.apikey-revoke-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Revoke this API key? Any integration using it will stop working immediately.')) return;
          btn.disabled = true;
          try {
            await apiFetch(`/api/api-keys/${encodeURIComponent(btn.dataset.id)}/admin-revoke/`, { method: 'POST' });
            loadApiKeys();
          } catch (err) {
            alert(formatApiError(err));
            btn.disabled = false;
          }
        });
      });
    } catch (err) {
      apiKeysPanel.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    }
  };
  document.getElementById('user-apikeys-toggle').addEventListener('click', () => {
    const wasHidden = apiKeysPanel.classList.contains('hidden');
    apiKeysPanel.classList.toggle('hidden');
    if (wasHidden && !apiKeysPanel.dataset.loaded) {
      apiKeysPanel.dataset.loaded = '1';
      loadApiKeys();
    }
  });

  const deactivateBtn = document.getElementById('user-force-deactivate');
  if (deactivateBtn) {
    deactivateBtn.addEventListener('click', async () => {
      if (!confirm(`Force-deactivate @${u.username}? This blocks their login and unpublishes their listings.`)) return;
      try {
        await apiFetch(`/api/accounts/users/${encodeURIComponent(u.id)}/force-deactivate/`, { method: 'POST' });
        afterChange();
      } catch (err) {
        alert(formatApiError(err));
      }
    });
  }

  const reverseStatus = (action, btnId) => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.addEventListener('click', async () => {
      try {
        await apiFetch(`/api/accounts/users/${encodeURIComponent(u.id)}/reverse-status/`, { method: 'POST', body: { action } });
        afterChange();
      } catch (err) {
        alert(formatApiError(err));
      }
    });
  };
  reverseStatus('unsuspend', 'user-unsuspend');
  reverseStatus('unban', 'user-unban');
  reverseStatus('reactivate', 'user-reactivate');

  if (isAdmin) {
    const editToggle = document.getElementById('user-edit-toggle');
    const editForm = document.getElementById('user-edit-form');
    const passwordToggle = document.getElementById('user-password-toggle');
    const passwordForm = document.getElementById('user-password-form');

    editToggle.addEventListener('click', () => {
      editForm.classList.toggle('hidden');
      passwordForm.classList.add('hidden');
    });
    passwordToggle.addEventListener('click', () => {
      passwordForm.classList.toggle('hidden');
      editForm.classList.add('hidden');
    });

    document.getElementById('user-edit-save').addEventListener('click', async () => {
      const alertBox = document.getElementById('user-edit-alert');
      alertBox.innerHTML = '';
      try {
        await apiFetch(`/api/accounts/users/${encodeURIComponent(u.id)}/`, {
          method: 'PATCH',
          body: {
            first_name: document.getElementById('ue-first').value,
            last_name: document.getElementById('ue-last').value,
            email: document.getElementById('ue-email').value,
            phone_number: document.getElementById('ue-phone').value,
            role: document.getElementById('ue-role').value,
            organization_name: document.getElementById('ue-org').value,
          },
        });
        afterChange();
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
      }
    });

    document.getElementById('user-password-save').addEventListener('click', async () => {
      const alertBox = document.getElementById('user-password-alert');
      alertBox.innerHTML = '';
      const newPassword = document.getElementById('up-new-password').value;
      try {
        await apiFetch(`/api/accounts/users/${encodeURIComponent(u.id)}/set-password/`, { method: 'POST', body: { new_password: newPassword } });
        alertBox.innerHTML = `<div class="alert alert-success" style="font-size:0.8rem; padding:var(--space-2);">Password updated.</div>`;
        document.getElementById('up-new-password').value = '';
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
      }
    });
  }
}
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

      if (!results.length) {
        listArea.innerHTML = `<div class="empty-state"><h3>No listings found</h3></div>`;
        return;
      }
      listArea.innerHTML = results.map((l) => `
        <div class="card" style="padding:14px 18px; margin-bottom:10px;">
          <div class="flex-between" style="align-items:flex-start;">
            <div>
              <div class="flex-between" style="justify-content:flex-start; gap:10px;">

                ${l.featured ? '<span class="pill pill-verified">Featured</span>' : ''}

              <p class="text-muted" style="margin:4px 0; font-size:0.82rem;">${escapeHtml(l.seller_username)} &middot; ${escapeHtml((l.status || '').replace('_', ' '))} &middot; ${money(l.price, l.currency)} &middot; ai ${l.ai_score != null ? l.ai_score : 'n/a'}</p>
            </div>
            <div style="text-align:right;">
              <a href="listing.html?slug=${encodeURIComponent(l.slug)}" target="_blank" class="text-muted" style="font-size:0.8rem;">Open &rarr;</a><br>
              <a href="#" class="all-listing-toggle text-muted" data-slug="${l.slug}" style="font-size:0.8rem; color:var(--color-gold-dark); font-weight:600;">Full details &darr;</a>
            </div>
          </div>

        </div>
      `).join('');

      listArea.querySelectorAll('.all-listing-toggle').forEach((link) => {
        const slug = link.dataset.slug;
        const panel = document.getElementById(`all-listing-details-${slug}`);
        const loadDetails = async () => {
          panel.innerHTML = `<p class="text-muted"><span class="spinner"></span> Loading&hellip;</p>`;
          try {
            const listing = await apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/`);
            let html = renderListingFullDetails(listing);
            html += `
              <div style="margin-top:var(--space-3); display:flex; gap:8px;">
                <textarea class="all-listing-notes" placeholder="Notes (optional)" style="flex:1; padding:var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem; min-height:40px;"></textarea>
              </div>
              <div id="all-listing-mod-alert-${slug}" style="margin-top:var(--space-2);"></div>
              <div style="margin-top:var(--space-2); display:flex; gap:8px;">
                <button class="btn btn-sm all-listing-approve" data-slug="${slug}">Approve &amp; publish</button>
                <button class="btn btn-outline btn-sm all-listing-reject" data-slug="${slug}">Reject</button>
              </div>
              ${deletePermanentlyHtml(slug)}
            `;
            panel.innerHTML = html;
            panel.dataset.loaded = '1';
            wireVerifiedBadgeButton(panel, loadDetails);
            wireMediaZoom(panel);
            wireCorrectionForm(panel, slug, loadDetails);
            wireDeletePermanentlyButton(panel, slug, load);

            const doModerate = async (decision) => {
              const alertBox = document.getElementById(`all-listing-mod-alert-${slug}`);
              const notes = panel.querySelector('.all-listing-notes')?.value || '';
              alertBox.innerHTML = '';
              try {
                await apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/moderate/`, { method: 'POST', body: { decision, notes } });
                load();
              } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
              }
            };
            panel.querySelector('.all-listing-approve')?.addEventListener('click', () => doModerate('approve'));
            panel.querySelector('.all-listing-reject')?.addEventListener('click', () => doModerate('reject'));
          } catch (err) {
            panel.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
          }
        };
        link.addEventListener('click', async (e) => {
          e.preventDefault();
          const isHidden = panel.classList.contains('hidden');
          if (isHidden) {
            panel.classList.remove('hidden');
            link.innerHTML = 'Hide full details &uarr;';
            if (!panel.dataset.loaded) await loadDetails();
          } else {
            panel.classList.add('hidden');
            link.innerHTML = 'Full details &darr;';
          }
        });
      });
    } catch (err) {
      listArea.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    }
  };

  document.getElementById('listing-search').addEventListener('input', debounce(load, 400));
  document.getElementById('listing-status-filter').addEventListener('change', load);
  load();
}

async function renderFlagsQueue(content) {
  const severityMap = { critical: 'pill-rejected', high: 'pill-rejected', medium: 'pill-pending', low: 'pill-draft' };
  try {
    const data = await apiFetch('/api/moderation/flags/?unreviewed=1');
    const results = data.results || data;
    if (!results.length) {
      content.innerHTML = `<div class="empty-state"><h3>No unreviewed flags</h3><p>The anti-circumvention scanner hasn't found anything pending review.</p></div>`;
      return;
    }
    content.innerHTML = results.map((f) => `
      <div class="card" style="padding:18px 20px; margin-bottom:var(--space-3);">
        <div class="flex-between" style="align-items:flex-start;">
          <div>
            <div class="flex-between" style="justify-content:flex-start; gap:10px;">
              <strong>${escapeHtml(f.username)}</strong>
              ${pillFor(f.severity, severityMap)}
            </div>
            <p style="margin:6px 0; font-size:0.88rem;">${escapeHtml((f.detected_pattern || '').replace(/_/g, ' '))}: <code>${escapeHtml(f.matched_text)}</code></p>
            <p class="text-muted" style="font-size:0.8rem; margin:0;">Confidence ${Math.round(f.confidence)}% &middot; ${timeAgo(f.created_at)}</p>
          </div>
          <div style="min-width:200px;">
            <div id="flag-alert-${f.id}"></div>
            <select class="flag-action" data-id="${f.id}" style="width:100%; margin-bottom:var(--space-2); padding:var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem;">
              <option value="warning">Warning</option>
              <option value="temporary_suspension">Temporary suspension</option>
              <option value="permanent_ban">Permanent ban</option>
              <option value="content_blocked">Content blocked</option>
              <option value="none">No action (false positive)</option>
            </select>
            <button class="btn btn-sm btn-block flag-submit" data-id="${f.id}">Apply</button>
          </div>
        </div>
      </div>
    `).join('');

    content.querySelectorAll('.flag-submit').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const action = document.querySelector(`.flag-action[data-id="${id}"]`).value;
        const alertBox = document.getElementById(`flag-alert-${id}`);
        alertBox.innerHTML = '';
        try {
          await apiFetch(`/api/moderation/flags/${id}/review/`, { method: 'POST', body: { action } });
          renderFlagsQueue(content);
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
        }
      });
    });
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

    content.querySelectorAll('.refund-action').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const alertBox = document.getElementById(`refund-alert-${id}`);
        alertBox.innerHTML = '';
        try {
          await apiFetch(`/api/payments/refunds/${id}/review/`, { method: 'POST', body: { status: btn.dataset.status } });

        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
        }
      });
    });
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function renderWithdrawalsQueue(content) {
  try {
    const data = await apiFetch('/api/wallet/withdrawals/queue/');
    const results = data.results || data;
    if (!results.length) {
      content.innerHTML = `<div class="empty-state"><h3>No pending withdrawal requests</h3></div>`;
      return;
    }
    content.innerHTML = results.map((w) => `
      <div class="card" style="padding:16px 20px; margin-bottom:10px;">
        <div class="flex-between" style="align-items:flex-start;">
          <div>
            <strong>${escapeHtml(w.wallet_owner_username)}</strong> &middot; ${money(w.amount)}
            ${w.risk_flagged ? `<span class="pill pill-rejected" title="At/above the configured single-withdrawal risk threshold">&#9888; high value</span>` : ''}
            <p class="text-muted" style="margin:4px 0; font-size:0.85rem;">${escapeHtml(w.destination_type.replace('_',' '))} &middot; ${escapeHtml(JSON.stringify(w.destination_details))}</p>
            <p class="text-muted" style="font-size:0.8rem; margin:0;">${timeAgo(w.created_at)}</p>
          </div>
          <div style="min-width:220px;">
            <div id="wd-alert-${w.id}"></div>
            <input type="text" class="wd-payout-ref" data-id="${w.id}" placeholder="Payout reference" style="width:100%; margin-bottom:6px; padding:var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem;">
            <button class="btn btn-sm btn-block wd-complete" data-id="${w.id}" style="margin-bottom:6px;">Mark paid</button>
            <input type="text" class="wd-reject-reason" data-id="${w.id}" placeholder="Rejection reason" style="width:100%; margin-bottom:6px; padding:var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem;">
            <button class="btn btn-outline btn-sm btn-block wd-reject" data-id="${w.id}">Reject</button>
          </div>
        </div>
      </div>
    `).join('');

    content.querySelectorAll('.wd-complete').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const alertBox = document.getElementById(`wd-alert-${id}`);
        const ref = document.querySelector(`.wd-payout-ref[data-id="${id}"]`)?.value || '';
        alertBox.innerHTML = '';
        try {
          await apiFetch(`/api/wallet/withdrawals/${id}/review/`, { method: 'POST', body: { status: 'completed', payout_reference: ref } });
          renderWithdrawalsQueue(content);
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
        }
      });
    });
    content.querySelectorAll('.wd-reject').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const alertBox = document.getElementById(`wd-alert-${id}`);
        const reason = document.querySelector(`.wd-reject-reason[data-id="${id}"]`)?.value || '';
        alertBox.innerHTML = '';
        try {
          await apiFetch(`/api/wallet/withdrawals/${id}/review/`, { method: 'POST', body: { status: 'rejected', rejection_reason: reason } });
          renderWithdrawalsQueue(content);
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
        }
      });
    });
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function renderTreasuryTab(content) {
  const isSuperAdmin = CURRENT_USER?.role === 'super_admin';
  const statusMap = { requested: 'pill-pending', approved: 'pill-pending', completed: 'pill-verified', rejected: 'pill-rejected' };

  content.innerHTML = `<p class="text-muted"><span class="spinner"></span> Loading&hellip;</p>`;
  try {
    const [walletData, accountsResp, withdrawalsResp] = await Promise.all([
      apiFetch('/api/wallet/platform/'),
      apiFetch('/api/wallet/company/payout-accounts/'),
      apiFetch('/api/wallet/company/withdrawals/'),
    ]);
    const accounts = accountsResp.results || accountsResp;
    const withdrawals = withdrawalsResp.results || withdrawalsResp;
    const activeAccounts = accounts.filter((a) => a.is_active);

    content.innerHTML = `
      <div class="card" style="padding:var(--space-5); margin-bottom:var(--space-5);">
        <p class="text-muted" style="margin:0;">Platform commission balance</p>
        <div style="font-size:2rem; font-weight:700;">${money(walletData.wallet.balance, walletData.wallet.currency)}</div>
        <p class="text-muted" style="font-size:0.85rem; margin-top:6px;">Company withdrawals below move money out of this balance. Approval requires a super_admin ("company owner") account.</p>
      </div>

      <div class="card" style="padding:var(--space-5); margin-bottom:var(--space-5);">
        <h3 style="margin-top:0;">Company payout accounts</h3>
        <div id="treasury-account-alert"></div>
        ${accounts.length ? accounts.map((a) => `
          <div class="table-row">
            <span>${escapeHtml(a.provider || a.account_type.replace('_', ' '))} &middot; ${escapeHtml(a.account_number)}</span>
            <span class="text-muted">${escapeHtml(a.account_name)}</span>
            <span>${a.is_active ? '<span class="pill pill-verified">active</span>' : '<span class="pill pill-draft">inactive</span>'}</span>
          </div>
        `).join('') : '<p class="text-muted">No company payout accounts yet -- add one below.</p>'}
        <form id="treasury-account-form" style="margin-top:14px; padding-top:14px; border-top:1px solid var(--color-border);">
          <div class="field-row">
            <div class="form-group">
              <label for="ta-type">Account type</label>
              <select id="ta-type"><option value="bank_account">Bank Account</option><option value="mobile_money">Mobile Money</option></select>
            </div>
            <div class="form-group"><label for="ta-provider">Provider</label><input type="text" id="ta-provider" placeholder="e.g. CRDB Bank"></div>
          </div>
          <div class="field-row">
            <div class="form-group"><label for="ta-number">Account number</label><input type="text" id="ta-number" required></div>
            <div class="form-group"><label for="ta-name">Account name</label><input type="text" id="ta-name" required></div>
          </div>
          <button type="submit" class="btn btn-sm">Add company account</button>
        </form>
      </div>

      <div class="card" style="padding:var(--space-5); margin-bottom:var(--space-5);">
        <h3 style="margin-top:0;">Request a treasury withdrawal</h3>
        <div id="treasury-request-alert"></div>
        ${activeAccounts.length ? `
          <form id="treasury-request-form">
            <div class="field-row">
              <div class="form-group">
                <label for="tr-amount">Amount</label>
                <input type="number" id="tr-amount" min="1" step="1" required>
              </div>
              <div class="form-group">
                <label for="tr-account">Payout to</label>
                <select id="tr-account">
                  ${activeAccounts.map((a) => `<option value="${a.id}">${escapeHtml(a.provider || a.account_type)} &middot; ${escapeHtml(a.account_number)}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="form-group"><label for="tr-reason">Reason</label><input type="text" id="tr-reason" placeholder="What this withdrawal is for"></div>

          </form>
        ` : '<div class="alert alert-info">Add a company payout account above first.</div>'}

      <h4 style="margin-bottom:10px;">Withdrawal requests</h4>
      <div id="treasury-withdrawals-list">
        ${withdrawals.length ? withdrawals.map((w) => `
          <div class="card" style="padding:14px 18px; margin-bottom:var(--space-2);">
            <div class="flex-between" style="align-items:flex-start;">
              <div>
                <strong>${money(w.amount)}</strong> &middot; ${escapeHtml(w.payout_account_display)}
                ${pillFor(w.status, statusMap)}
                <p class="text-muted" style="margin:4px 0 0 0; font-size:0.82rem;">${escapeHtml(w.reason || '')} &middot; requested by ${escapeHtml(w.requested_by_username)} &middot; ${timeAgo(w.created_at)}</p>
              </div>
              ${isSuperAdmin && w.status === 'requested' ? `
                <div style="min-width:200px;">
                  <div id="treasury-review-alert-${w.id}"></div>
                  <input type="text" class="treasury-payout-ref" data-id="${w.id}" placeholder="Payout reference" style="width:100%; margin-bottom:6px; padding:var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem;">

        `).join('') : '<p class="text-muted">No treasury withdrawal requests yet.</p>'}
      </div>
    `;

    document.getElementById('treasury-account-form').addEventListener('submit', async (e) => {
      e.preventDefault();

            provider: document.getElementById('ta-provider').value,
            account_number: document.getElementById('ta-number').value,
            account_name: document.getElementById('ta-name').value,
          },
        });
        renderTreasuryTab(content);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
      }
    });

    const requestForm = document.getElementById('treasury-request-form');
    if (requestForm) {
      requestForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('treasury-request-alert');
        alertBox.innerHTML = '';
        try {
          await apiFetch('/api/wallet/company/withdrawals/', {
            method: 'POST',
            body: {
              amount: document.getElementById('tr-amount').value,
              payout_account: document.getElementById('tr-account').value,
              reason: document.getElementById('tr-reason').value,
            },
          });
          renderTreasuryTab(content);
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
        }
      });
    }

    const doReview = async (id, statusValue, extra = {}) => {
      const alertBox = document.getElementById(`treasury-review-alert-${id}`);
      alertBox.innerHTML = '';
      try {
        await apiFetch(`/api/wallet/company/withdrawals/${id}/review/`, { method: 'POST', body: { status: statusValue, ...extra } });
        renderTreasuryTab(content);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
      }
    };
    content.querySelectorAll('.treasury-approve').forEach((btn) => {
      btn.addEventListener('click', () => {
        const ref = document.querySelector(`.treasury-payout-ref[data-id="${btn.dataset.id}"]`)?.value || '';
        doReview(btn.dataset.id, 'completed', { payout_reference: ref });
      });
    });
    content.querySelectorAll('.treasury-reject').forEach((btn) => {
      btn.addEventListener('click', () => {
        const reason = document.querySelector(`.treasury-reject-reason[data-id="${btn.dataset.id}"]`)?.value || '';
        doReview(btn.dataset.id, 'rejected', { rejection_reason: reason });
      });
    });
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}
