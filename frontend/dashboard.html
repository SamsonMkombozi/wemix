<script>
if (!Auth.isLoggedIn()) {
  window.location.href = 'login.html';
}
const _dashUser = Auth.getUser();
if (['moderator', 'admin', 'super_admin'].includes(_dashUser?.role)) {
  window.location.href = 'moderator.html';
}

const gate = document.getElementById('gate');

gate.innerHTML = `
  <div id="terms-banner"></div>
  <div class="dash-grid">
    <aside class="dash-sidebar">
      <div class="card" id="me-card">
        <span class="spinner"></span>
      </div>
      <div class="card" id="wallet-card">
        <span class="spinner"></span>
      </div>
    </aside>
    <section>
      <div class="dash-tabs">
        <div class="dash-tab active" data-tab="listings">My Listings</div>
        <div class="dash-tab" data-tab="create">Sell News</div>
        <div class="dash-tab" data-tab="verification">Verification</div>
        <div class="dash-tab" data-tab="purchases">My Purchases</div>
        <div class="dash-tab" data-tab="bookmarks">Bookmarks</div>
        <div class="dash-tab" data-tab="following">Following</div>
        <div class="dash-tab" data-tab="withdrawals">Withdrawals</div>
        <div class="dash-tab" data-tab="support">Support</div>
      </div>
      <div id="tab-content"></div>
    </section>
  </div>
`;

(async () => {
  try {
    const termsStatus = await apiFetch('/api/terms/status/');
    if (termsStatus.needs_acceptance) {
      document.getElementById('terms-banner').innerHTML = `
        <div class="alert alert-info" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;">
          <span>Our <a href="terms.html" target="_blank" style="font-weight:600;">Terms &amp; Conditions</a> have been updated (v${escapeHtml(termsStatus.current_version)}). Please review and re-accept to continue.</span>
          <button class="btn btn-sm" id="terms-reaccept-btn">I accept</button>
        </div>
      `;
      document.getElementById('terms-reaccept-btn').addEventListener('click', async (e) => {
        e.target.disabled = true;
        try {
          await apiFetch('/api/terms/accept/', { method: 'POST', body: { version: termsStatus.current_version } });
          document.getElementById('terms-banner').innerHTML = '';
        } catch (err) {
          alert(formatApiError(err));
          e.target.disabled = false;
        }
      });
    }
  } catch (e) { /* non-fatal */ }
})();

document.querySelectorAll('.dash-tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.dash-tab').forEach((t) => t.classList.remove('active'));
    tab.classList.add('active');
    renderTab(tab.dataset.tab);
  });
});

/* Country -> Region -> District hierarchy (real Tanzanian administrative
   regions/districts, a representative subset -- not exhaustive of every
   ward). City/area stays free text since hand-curating every ward
   accurately isn't practical; this still replaces pure free-text entry
   for the region/district levels, which is where search/filter
   fragmentation ("Dar es Salaam" vs "DSM" vs "Dar-es-Salaam") mattered most. */
const TZ_LOCATIONS = {
  'Dar es Salaam': ['Ilala', 'Kinondoni', 'Temeke', 'Ubungo', 'Kigamboni'],
  'Arusha': ['Arusha City', 'Arusha (Meru)', 'Monduli', 'Karatu', 'Longido'],
  'Dodoma': ['Dodoma City', 'Bahi', 'Chamwino', 'Kondoa', 'Mpwapwa'],
  'Mwanza': ['Nyamagana', 'Ilemela', 'Sengerema', 'Magu', 'Kwimba'],
  'Mbeya': ['Mbeya City', 'Mbeya Rural', 'Rungwe', 'Kyela', 'Chunya'],
  'Kilimanjaro': ['Moshi Municipal', 'Moshi Rural', 'Hai', 'Rombo', 'Same'],
  'Tanga': ['Tanga City', 'Korogwe', 'Muheza', 'Lushoto', 'Pangani'],
  'Morogoro': ['Morogoro Municipal', 'Kilosa', 'Mvomero', 'Kilombero', 'Ulanga'],
  'Zanzibar Urban/West': ['Mjini', 'Magharibi A', 'Magharibi B'],
  'Zanzibar North': ['Kaskazini A', 'Kaskazini B'],
  'Mtwara': ['Mtwara Municipal', 'Masasi', 'Newala', 'Nanyumbu'],
  'Iringa': ['Iringa Municipal', 'Kilolo', 'Mufindi', 'Iringa Rural'],
};

/* Ward/area level -- only populated for districts we're confident giving
   exhaustive-sounding real data for (Dar es Salaam's 5 districts). Every
   other district falls back to the free-text City/area field below
   rather than us guessing at ward names we're not sure of. */
const TZ_WARDS = {
  'Ilala': ['Kariakoo', 'Upanga', 'Kivukoni', 'Buguruni', 'Jangwani', 'Kisutu'],
  'Kinondoni': ['Msasani', 'Mikocheni', 'Sinza', 'Kawe', 'Tandale', 'Magomeni'],
  'Temeke': ['Mbagala', "Chang'ombe", 'Keko', 'Kurasini', 'Miburani'],
  'Ubungo': ['Ubungo', 'Kimara', 'Manzese', 'Makuburi', 'Kwembe'],
  'Kigamboni': ['Kigamboni', 'Vijibweni', 'Kibada'],
};

/* Mounts a Region / District / (Ward, where we have real data) / City
   picker into `container`, writing a formatted
   "City, Ward, District, Region" string into a hidden input with id
   `hiddenId`. `currentValue` (existing free-text location data) is put
   into the City/area field as a fallback if it doesn't match a known
   region -- so old data isn't discarded, just not parsed into the
   hierarchy. Shared between the seller create-listing form and the
   listing edit form. */
function mountLocationPicker(container, hiddenId, currentValue) {
  const regions = Object.keys(TZ_LOCATIONS);
  let prefillRegion = '';
  let prefillDistrict = '';
  let prefillWard = '';
  let prefillCity = currentValue || '';
  const parts = (currentValue || '').split(',').map((s) => s.trim()).filter(Boolean);
  if (parts.length) {
    const matchedRegion = regions.find((r) => parts[parts.length - 1] === r);
    if (matchedRegion) {
      prefillRegion = matchedRegion;
      let rest = parts.slice(0, -1);
      if (rest.length && TZ_LOCATIONS[matchedRegion].includes(rest[rest.length - 1])) {
        prefillDistrict = rest[rest.length - 1];
        rest = rest.slice(0, -1);
      }
      if (prefillDistrict && (TZ_WARDS[prefillDistrict] || []).includes(rest[rest.length - 1])) {
        prefillWard = rest[rest.length - 1];
        rest = rest.slice(0, -1);
      }
      prefillCity = rest.join(', ');
    }
  }

  container.innerHTML = `
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <select id="${hiddenId}-region" style="flex:1; min-width:120px;">
        <option value="">Region&hellip;</option>
        ${regions.map((r) => `<option value="${escapeHtml(r)}" ${r === prefillRegion ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}
      </select>
      <select id="${hiddenId}-district" style="flex:1; min-width:120px;">
        <option value="">District&hellip;</option>
      </select>
    </div>
    <div id="${hiddenId}-ward-wrap" class="hidden" style="margin-top:6px;">
      <select id="${hiddenId}-ward" style="width:100%;"><option value="">Ward&hellip;</option></select>
    </div>
    <input type="text" id="${hiddenId}-city" placeholder="City / area (optional)" value="${escapeHtml(prefillCity)}" style="margin-top:6px;">
    <input type="hidden" id="${hiddenId}">
  `;

  const regionSelect = document.getElementById(`${hiddenId}-region`);
  const districtSelect = document.getElementById(`${hiddenId}-district`);
  const wardWrap = document.getElementById(`${hiddenId}-ward-wrap`);
  const wardSelect = document.getElementById(`${hiddenId}-ward`);
  const cityInput = document.getElementById(`${hiddenId}-city`);
  const hiddenInput = document.getElementById(hiddenId);

  const populateDistricts = (selected) => {
    const districts = TZ_LOCATIONS[regionSelect.value] || [];
    districtSelect.innerHTML = `<option value="">District&hellip;</option>` +
      districts.map((d) => `<option value="${escapeHtml(d)}" ${d === selected ? 'selected' : ''}>${escapeHtml(d)}</option>`).join('');
  };
  const populateWards = (selected) => {
    const wards = TZ_WARDS[districtSelect.value] || [];
    if (!wards.length) {
      wardWrap.classList.add('hidden');
      wardSelect.innerHTML = `<option value="">Ward&hellip;</option>`;
      return;
    }
    wardWrap.classList.remove('hidden');
    wardSelect.innerHTML = `<option value="">Ward&hellip;</option>` +
      wards.map((w) => `<option value="${escapeHtml(w)}" ${w === selected ? 'selected' : ''}>${escapeHtml(w)}</option>`).join('');
  };
  populateDistricts(prefillDistrict);
  populateWards(prefillWard);

  const syncHidden = () => {
    const bits = [cityInput.value.trim(), wardSelect.value, districtSelect.value, regionSelect.value].filter(Boolean);
    hiddenInput.value = bits.join(', ');
  };
  regionSelect.addEventListener('change', () => { populateDistricts(''); populateWards(''); syncHidden(); });
  districtSelect.addEventListener('change', () => { populateWards(''); syncHidden(); });
  wardSelect.addEventListener('change', syncHidden);
  cityInput.addEventListener('input', syncHidden);
  syncHidden();
}

function pillForStatus(status, map) {
  return `<span class="pill ${map[status] || 'pill-draft'}">${escapeHtml((status || '').replace('_', ' '))}</span>`;
}

async function loadMe() {
  const el = document.getElementById('me-card');
  try {
    const me = await apiFetch('/api/accounts/me/');
    Auth.setSession({ user: me });
    const kycMap = { verified: 'pill-verified', pending: 'pill-pending', rejected: 'pill-rejected', unsubmitted: 'pill-draft' };
    el.innerHTML = `
      <h3 style="margin-bottom:4px;">${escapeHtml(me.username)}</h3>
      <p class="text-muted" style="margin:0 0 12px 0; font-size:0.85rem;">${escapeHtml(me.email)}</p>
      <p style="font-size:0.85rem;">Role: <strong>${escapeHtml((me.role || '').replace('_', ' '))}</strong></p>
      <p style="font-size:0.85rem;">ID verification: ${pillForStatus(me.id_verification_status, kycMap)}</p>
      ${me.id_verification_status !== 'verified' ? `<p class="form-hint">Submit ID verification (via the API's /api/accounts/kyc/ endpoint) before you can sell.</p>` : ''}
    `;
  } catch (err) {
    el.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function loadWallet() {
  const el = document.getElementById('wallet-card');
  try {
    const data = await apiFetch('/api/wallet/me/');
    el.innerHTML = `
      <p class="text-muted" style="margin:0 0 4px 0; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.06em;">Wallet balance</p>
      <div class="wallet-balance">${Number(data.wallet.balance).toLocaleString()} <span class="wallet-currency">${escapeHtml(data.wallet.currency)}</span></div>
      <p class="form-hint">${data.recent_transactions.length} recent transaction(s)</p>
    `;
  } catch (err) {
    el.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function renderTab(tab) {
  const content = document.getElementById('tab-content');
  content.innerHTML = `<p class="text-muted"><span class="spinner"></span> Loading&hellip;</p>`;

  if (tab === 'listings') return renderListingsTab(content);
  if (tab === 'create') return renderCreateTab(content);
  if (tab === 'verification') return renderVerificationTab(content);
  if (tab === 'purchases') return renderPurchasesTab(content);
  if (tab === 'bookmarks') return renderBookmarksTab(content);
  if (tab === 'following') return renderFollowingTab(content);
  if (tab === 'withdrawals') return renderWithdrawalsTab(content);
  if (tab === 'support') return renderSupportTab(content);
}

async function renderListingsTab(content) {
  const statusMap = { published: 'pill-verified', draft: 'pill-draft', submitted: 'pill-pending', suspended: 'pill-rejected', removed: 'pill-rejected', sold_out: 'pill-verified' };
  try {
    const data = await apiFetch('/api/news/listings/?mine=1');
    const results = data.results || data;
    if (!results.length) {
      content.innerHTML = `<div class="empty-state"><h3>No listings yet</h3><p>Use the "Sell News" tab to publish your first verified story.</p></div>`;
      return;
    }
    content.innerHTML = results.map((l) => `
      <div class="card" style="padding:18px 20px; margin-bottom:12px;">
        <div class="flex-between">
          <div>
            <h3 style="margin:0 0 6px 0;">${escapeHtml(l.title)}</h3>
            <p class="text-muted" style="margin:0; font-size:0.85rem;">${money(l.price, l.currency)} &middot; ${escapeHtml(l.purchase_count)} sold &middot; ${escapeHtml(l.view_count)} views &middot; ${l.cover_image ? '1+' : '0'} media</p>
          </div>
          <div style="text-align:right;">
            ${pillForStatus(l.status, statusMap)}
            <div style="margin-top:8px;">
              ${l.status === 'draft' ? `<button class="btn btn-sm submit-btn" data-slug="${l.slug}">Submit for review</button>` : ''}
              <button class="btn btn-ghost btn-sm edit-toggle-btn" data-slug="${l.slug}">Edit</button>
              <button class="btn btn-ghost btn-sm media-toggle-btn" data-slug="${l.slug}">Add media</button>
              <a href="listing.html?slug=${encodeURIComponent(l.slug)}" class="btn btn-ghost btn-sm">View</a>
            </div>
          </div>
        </div>
        <div class="edit-listing-area hidden" id="edit-area-${l.slug}" style="margin-top:14px; padding-top:14px; border-top:1px solid var(--color-border);"></div>
        <div class="media-upload-area hidden" id="media-area-${l.slug}" style="margin-top:14px; padding-top:14px; border-top:1px solid var(--color-border);">
          <div id="media-alert-${l.slug}"></div>
          <form class="media-form" data-slug="${l.slug}">
            <div class="field-row">
              <div class="form-group">
                <label for="media-type-${l.slug}">Media type</label>
                <select id="media-type-${l.slug}">
                  <option value="image">Image</option>
                  <option value="video">Video</option>
                  <option value="document">Document</option>
                </select>
              </div>
              <div class="form-group">
                <label for="media-file-${l.slug}">File</label>
                <input type="file" id="media-file-${l.slug}" accept="image/*,video/*" required>
              </div>
            </div>
            <label style="font-size:0.85rem; display:flex; align-items:center; gap:6px; margin-bottom:12px;">
              <input type="checkbox" id="media-cover-${l.slug}" checked style="width:auto;">
              Use as cover image
            </label>
            <button type="submit" class="btn btn-sm">Upload</button>
          </form>
        </div>
      </div>
    `).join('');

    content.querySelectorAll('.edit-toggle-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const slug = btn.dataset.slug;
        const area = document.getElementById(`edit-area-${slug}`);
        const isHidden = area.classList.contains('hidden');
        area.classList.toggle('hidden');
        if (isHidden && !area.dataset.loaded) loadEditForm(slug, area);
      });
    });

    content.querySelectorAll('.submit-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';
        try {
          await apiFetch(`/api/news/listings/${encodeURIComponent(btn.dataset.slug)}/submit/`, { method: 'POST' });
          renderListingsTab(content);
        } catch (err) {
          alert(formatApiError(err));
          btn.disabled = false;
          btn.textContent = 'Submit for review';
        }
      });
    });

    content.querySelectorAll('.media-toggle-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.getElementById(`media-area-${btn.dataset.slug}`).classList.toggle('hidden');
      });
    });

    content.querySelectorAll('.media-form').forEach((form) => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const slug = form.dataset.slug;
        const alertBox = document.getElementById(`media-alert-${slug}`);
        const submitBtn = form.querySelector('button[type="submit"]');
        const fileInput = document.getElementById(`media-file-${slug}`);
        alertBox.innerHTML = '';

        if (!fileInput.files.length) {
          alertBox.innerHTML = `<div class="alert alert-error">Choose a file first.</div>`;
          return;
        }

        const formData = new FormData();
        formData.append('media_type', document.getElementById(`media-type-${slug}`).value);
        formData.append('file', fileInput.files[0]);
        formData.append('is_cover', document.getElementById(`media-cover-${slug}`).checked);

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Uploading&hellip;';
        try {
          await apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/media/`, {
            method: 'POST', body: formData, isForm: true,
          });
          alertBox.innerHTML = `<div class="alert alert-success">Media uploaded.</div>`;
          setTimeout(() => renderListingsTab(content), 900);
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Upload';
        }
      });
    });
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function loadEditForm(slug, area) {
  area.innerHTML = `<p class="text-muted"><span class="spinner"></span> Loading&hellip;</p>`;
  try {
    const listing = await apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/`);
    area.dataset.loaded = '1';
    area.innerHTML = `
      <div id="edit-alert-${slug}"></div>
      ${listing.status === 'published' ? `<p class="form-hint">Editing a published listing pulls it back to pending re-review before it's visible to buyers again.</p>` : ''}
      <form class="edit-listing-form" data-slug="${slug}">
        <div class="form-group">
          <label for="edit-title-${slug}">Title</label>
          <input type="text" id="edit-title-${slug}" value="${escapeHtml(listing.title)}" required>
        </div>
        <div class="form-group">
          <label for="edit-description-${slug}">Short description</label>
          <textarea id="edit-description-${slug}" style="min-height:50px;" required>${escapeHtml(listing.description)}</textarea>
        </div>
        <div class="form-group">
          <label for="edit-body-${slug}">Full story</label>
          <textarea id="edit-body-${slug}" style="min-height:120px;" required>${escapeHtml(listing.body)}</textarea>
        </div>
        <div class="field-row">
          <div class="form-group">
            <label for="edit-byline-${slug}">Byline</label>
            <input type="text" id="edit-byline-${slug}" value="${escapeHtml(listing.byline || '')}">
          </div>
          <div class="form-group">
            <label for="edit-dateline-${slug}">Dateline</label>
            <input type="text" id="edit-dateline-${slug}" value="${escapeHtml(listing.dateline || '')}">
          </div>
        </div>
        <div class="field-row">
          <div class="form-group">
            <label for="edit-location-${slug}">Location</label>
            <div id="edit-location-wrap-${slug}"></div>
          </div>
          <div class="form-group">
            <label for="edit-price-${slug}">Price (TZS)</label>
            <input type="number" id="edit-price-${slug}" min="0" step="1" value="${listing.price}" required>
          </div>
        </div>
        <button type="submit" class="btn btn-sm" id="edit-save-btn-${slug}">Save changes</button>
        <button type="button" class="btn btn-ghost btn-sm edit-history-toggle" data-slug="${slug}">View edit history</button>
      </form>
      <div class="hidden" id="edit-history-${slug}" style="margin-top:12px;"></div>
    `;

    mountLocationPicker(document.getElementById(`edit-location-wrap-${slug}`), `edit-location-${slug}`, listing.location || '');

    document.querySelector(`.edit-listing-form[data-slug="${slug}"]`).addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById(`edit-alert-${slug}`);
      const btn = document.getElementById(`edit-save-btn-${slug}`);
      alertBox.innerHTML = '';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Saving&hellip;';
      try {
        await apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/`, {
          method: 'PATCH',
          body: {
            title: document.getElementById(`edit-title-${slug}`).value,
            description: document.getElementById(`edit-description-${slug}`).value,
            body: document.getElementById(`edit-body-${slug}`).value,
            byline: document.getElementById(`edit-byline-${slug}`).value,
            dateline: document.getElementById(`edit-dateline-${slug}`).value,
            location: document.getElementById(`edit-location-${slug}`).value,
            price: document.getElementById(`edit-price-${slug}`).value,
          },
        });
        alertBox.innerHTML = `<div class="alert alert-success">Saved.</div>`;
        setTimeout(() => renderListingsTab(document.getElementById('tab-content')), 1000);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
        btn.disabled = false;
        btn.textContent = 'Save changes';
      }
    });

    document.querySelector(`.edit-history-toggle[data-slug="${slug}"]`).addEventListener('click', async () => {
      const histEl = document.getElementById(`edit-history-${slug}`);
      const isHidden = histEl.classList.contains('hidden');
      histEl.classList.toggle('hidden');
      if (!isHidden || histEl.dataset.loaded) return;
      histEl.dataset.loaded = '1';
      histEl.innerHTML = `<p class="text-muted"><span class="spinner"></span> Loading&hellip;</p>`;
      try {
        const revisions = await apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/revisions/`);
        histEl.innerHTML = revisions.length ? revisions.map((r) => `
          <div class="table-row">
            <span>${escapeHtml(r.snapshot.title || '')}</span>
            <span class="text-muted">${escapeHtml(r.edited_by || 'unknown')}</span>
            <span class="text-muted">${timeAgo(r.created_at)}</span>
          </div>
        `).join('') : '<p class="text-muted">No prior edits.</p>';
      } catch (err) {
        histEl.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
      }
    });
  } catch (err) {
    area.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function loadCorporateCard(me) {
  const card = document.getElementById('corporate-card');
  if (!card) return;
  const kybMap = { verified: 'pill-verified', pending: 'pill-pending', rejected: 'pill-rejected' };
  try {
    const data = await apiFetch('/api/accounts/corporate-verifications/');
    const submissions = data.results || data;
    const latest = submissions[0];

    card.innerHTML = `
      <div class="flex-between" style="margin-bottom:4px;">
        <h4 style="margin:0;">Corporate account</h4>
        ${me.is_corporate ? '<span class="pill pill-verified">&#10003; Verified organization</span>' : (latest ? pillForStatus(latest.status, kybMap) : '')}
      </div>
      <p class="text-muted" style="margin-top:0; font-size:0.85rem;">Buying on behalf of an organization instead of as an individual? Submit your business documents for verification.</p>
      ${me.is_corporate ? '' : `
        <div id="corporate-alert"></div>
        <form id="corporate-form">
          <div class="form-group">
            <label for="corp-name">Company name</label>
            <input type="text" id="corp-name" required>
          </div>
          <div class="field-row">
            <div class="form-group">

            </div>
          </div>
          <button type="submit" class="btn btn-sm" id="payout-submit-btn">Add payout account</button>
        </form>
      </div>

      <div class="card" style="padding:22px; margin-bottom:20px;">
        <h3 style="margin-top:0;">Request a withdrawal</h3>
        <p class="text-muted" style="margin-top:-8px;">Available balance: <strong>${money(walletData.wallet.balance, walletData.wallet.currency)}</strong></p>
        <div id="withdraw-alert"></div>
        ${verifiedAccounts.length ? `
          <form id="withdraw-form">
            <div class="field-row">
              <div class="form-group">
                <label for="w-amount">Amount</label>
                <input type="number" id="w-amount" min="1" step="1" required>
              </div>
              <div class="form-group">
                <label for="w-account">Payout to</label>
                <select id="w-account">
                  ${verifiedAccounts.map((a) => `<option value="${a.id}">${escapeHtml(a.provider || a.account_type)} &middot; ${escapeHtml(a.account_number)}</option>`).join('')}
                </select>
              </div>
            </div>
            <button type="submit" class="btn" id="withdraw-btn">Request withdrawal</button>
          </form>
        ` : `<div class="alert alert-info">Add and verify a payout account above before requesting a withdrawal.</div>`}
      </div>

      <h4 style="margin-bottom:10px;">Withdrawal history</h4>
      <div id="withdraw-list">
        ${results.length ? results.map((w) => `
          <div class="table-row">
            <span>${money(w.amount, walletData.wallet.currency)}</span>
            <span>${escapeHtml(w.payout_account_display || w.destination_type.replace('_', ' '))}</span>
            <span>${pillForStatus(w.status, statusMap)}</span>
            <span class="text-muted">${timeAgo(w.created_at)}</span>
          </div>
        `).join('') : '<p class="text-muted">No withdrawal requests yet.</p>'}
      </div>
    `;

    document.getElementById('payout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('payout-alert');
      const btn = document.getElementById('payout-submit-btn');
      alertBox.innerHTML = '';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        await apiFetch('/api/wallet/payout-accounts/', {
          method: 'POST',
          body: {
            account_type: document.getElementById('p-type').value,
            provider: document.getElementById('p-provider').value,
            account_number: document.getElementById('p-number').value,
            account_name: document.getElementById('p-name').value,
          },
        });
        renderWithdrawalsTab(content);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
        btn.disabled = false;
        btn.textContent = 'Add payout account';
      }
    });

    content.querySelectorAll('.payout-set-default').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await apiFetch(`/api/wallet/payout-accounts/${btn.dataset.id}/set-default/`, { method: 'POST' });
          renderWithdrawalsTab(content);
        } catch (err) {
          alert(formatApiError(err));
        }
      });
    });

    const withdrawForm = document.getElementById('withdraw-form');
    if (withdrawForm) {
      withdrawForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('withdraw-alert');
        const btn = document.getElementById('withdraw-btn');
        alertBox.innerHTML = '';
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';
        try {
          await apiFetch('/api/wallet/withdrawals/', {
            method: 'POST',
            body: {
              amount: document.getElementById('w-amount').value,
              payout_account: document.getElementById('w-account').value,
            },
          });
          renderWithdrawalsTab(content);
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
          btn.disabled = false;
          btn.textContent = 'Request withdrawal';
        }
      });
    }
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function renderSupportTab(content) {
  content.innerHTML = `
    <div class="card" style="padding:20px; margin-bottom:20px;">
      <h3 style="margin-top:0;">New support request</h3>
      <div id="ticket-alert"></div>
      <form id="ticket-form">
        <div class="field-row">
          <div class="form-group">
            <label for="ticket-category">Category</label>
            <select id="ticket-category">
              <option value="question">Question</option>
              <option value="complaint">Complaint</option>
              <option value="refund_help">Refund help</option>
              <option value="compliment">Compliment</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="ticket-subject">Subject</label>
            <input type="text" id="ticket-subject" required>
          </div>
        </div>
        <div class="form-group">
          <label for="ticket-message">Message</label>
          <textarea id="ticket-message" style="min-height:70px;" required></textarea>
        </div>
        <button type="submit" class="btn btn-sm" id="ticket-submit-btn">Submit</button>
      </form>
    </div>
    <h4 style="margin-bottom:10px;">My tickets</h4>
    <div id="ticket-list"><p class="text-muted"><span class="spinner"></span> Loading&hellip;</p></div>
  `;

  const statusMap = { open: 'pill-pending', in_progress: 'pill-pending', resolved: 'pill-verified', closed: 'pill-draft' };

  const loadTickets = async () => {
    const listEl = document.getElementById('ticket-list');
    try {
      const data = await apiFetch('/api/support-tickets/');
      const results = data.results || data;
      if (!results.length) {
        listEl.innerHTML = `<div class="empty-state"><h3>No tickets yet</h3><p>Questions, complaints, refund help, or compliments -- submit one above.</p></div>`;
        return;
      }
      listEl.innerHTML = results.map((t) => `
        <div class="card" style="padding:16px 18px; margin-bottom:10px;">
          <div class="flex-between" style="align-items:flex-start;">
            <div>
              <strong>${escapeHtml(t.subject)}</strong>
              <span class="pill pill-draft" style="margin-left:6px;">${escapeHtml((t.category || '').replace('_', ' '))}</span>
              ${pillForStatus(t.status, statusMap)}
              <p class="text-muted" style="margin:6px 0 0 0; font-size:0.85rem;">${escapeHtml(t.message)}</p>
              <p class="text-muted" style="margin:4px 0 0 0; font-size:0.78rem;">${timeAgo(t.created_at)}</p>
            </div>
          </div>
          ${(t.messages || []).length ? `
            <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--color-border); display:flex; flex-direction:column; gap:8px;">
              ${t.messages.map((m) => `
                <div style="font-size:0.85rem;">
                  <strong>${m.is_staff_reply ? 'Support' : escapeHtml(m.author_username)}:</strong>
                  <span>${escapeHtml(m.message)}</span>
                  <span class="text-muted" style="font-size:0.72rem;"> &middot; ${timeAgo(m.created_at)}</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
          ${t.status !== 'closed' ? `
            <div style="margin-top:10px; display:flex; gap:8px;">
              <input type="text" class="ticket-reply-input" data-id="${t.id}" placeholder="Add a reply&hellip;" style="flex:1; padding:8px; border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem;">
              <button class="btn btn-sm ticket-reply-btn" data-id="${t.id}">Send</button>
            </div>
          ` : ''}
        </div>
      `).join('');

      listEl.querySelectorAll('.ticket-reply-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const input = document.querySelector(`.ticket-reply-input[data-id="${id}"]`);
          const message = input.value.trim();
          if (!message) return;
          btn.disabled = true;
          try {
            await apiFetch(`/api/support-tickets/${id}/reply/`, { method: 'POST', body: { message } });
            loadTickets();
          } catch (err) {
            alert(formatApiError(err));
            btn.disabled = false;
          }
        });
      });
    } catch (err) {
      listEl.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    }
  };

  document.getElementById('ticket-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('ticket-alert');
    const btn = document.getElementById('ticket-submit-btn');
    alertBox.innerHTML = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Submitting&hellip;';
    try {
      await apiFetch('/api/support-tickets/', {
        method: 'POST',
        body: {
          category: document.getElementById('ticket-category').value,
          subject: document.getElementById('ticket-subject').value,
          message: document.getElementById('ticket-message').value,
        },
      });
      document.getElementById('ticket-form').reset();
      alertBox.innerHTML = `<div class="alert alert-success">Submitted.</div>`;
      loadTickets();
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit';
    }
  });

  loadTickets();
}

loadMe();
loadWallet();
renderTab('listings');
</script>
