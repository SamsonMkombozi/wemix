<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Habari Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="topnav-root"></div>

<main class="container section" id="gate">
  <p class="text-muted"><span class="spinner"></span> Loading dashboard&hellip;</p>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
if (!Auth.isLoggedIn()) {
  window.location.href = 'login.html';
}
const _dashUser = Auth.getUser();
if (['moderator', 'admin', 'super_admin'].includes(_dashUser?.role)) {
  window.location.href = 'moderator.html';
}

const gate = document.getElementById('gate');

// Grouped nav replacing a flat row of 11 equally-weighted tabs -- see
// css/style.css's "Dashboard primary navigation" block for the styling
// rationale (native <details> gives free collapse/expand at the tablet
// tier once .dash-grid stacks to one column; mobile gets its own
// bottom-nav + drawer below instead of the grouped list).
const DASH_NAV_GROUPS = {
  selling: { label: 'Selling', tabs: [['listings', 'My Listings'], ['create', 'Sell News'], ['verification', 'Verification']] },
  buying: { label: 'Buying', tabs: [['purchases', 'My Purchases'], ['bookmarks', 'Bookmarks'], ['following', 'Following']] },
  account: { label: 'Account', tabs: [['withdrawals', 'Withdrawals'], ['support', 'Support'], ['subscriptions', 'Subscriptions'], ['alerts', 'Alerts'], ['developer', 'Developer']] },
};
const DASH_GROUP_ICONS = {
  selling: '<path d="M20.59 13.41L11 3.83A2 2 0 009.59 3.24L4 3a1 1 0 00-1 1l.24 5.59a2 2 0 00.58 1.41l9.58 9.58a2 2 0 002.83 0l4.36-4.36a2 2 0 000-2.83z"/><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"/>',
  buying: '<path d="M6 2l1.5 5M18 2l-1.5 5M3 7h18l-1.5 12a2 2 0 01-2 1.7H6.5a2 2 0 01-2-1.7L3 7z"/>',
  account: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>',
};

function groupForTab(tab) {
  return Object.keys(DASH_NAV_GROUPS).find((g) => DASH_NAV_GROUPS[g].tabs.some(([t]) => t === tab));
}

function navLinkHtml(t, label) {
  return `<a class="dash-nav-link" data-tab="${t}">${escapeHtml(label)}</a>`;
}

gate.innerHTML = `
  <div id="terms-banner"></div>
  <div class="dash-grid">
    <aside class="dash-sidebar">
      <div class="card" id="me-card">
        <span class="spinner"></span>
      </div>
      <div class="card" id="wallet-card">
        <span class="spinner"></span>
      </div>
      <nav class="dash-nav" id="dash-nav">
        ${Object.entries(DASH_NAV_GROUPS).map(([key, g]) => `
          <details class="dash-nav-group" open data-group="${key}">
            <summary>${escapeHtml(g.label)}</summary>
            ${g.tabs.map(([t, label]) => navLinkHtml(t, label)).join('')}
          </details>
        `).join('')}
      </nav>
    </aside>
    <section>
      <div id="tab-content"></div>
    </section>
  </div>

  <div class="dash-bottom-nav" id="dash-bottom-nav">
    ${Object.entries(DASH_NAV_GROUPS).map(([key, g]) => `
      <button class="dash-bottom-nav-item" data-group="${key}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${DASH_GROUP_ICONS[key]}</svg>
        <span>${escapeHtml(g.label)}</span>
      </button>
    `).join('')}
  </div>
  <div class="dash-drawer-overlay" id="dash-drawer-overlay">
    <div class="dash-drawer" id="dash-drawer"></div>
  </div>
`;
document.body.classList.add('has-dash-bottom-nav');

let currentDashTab = 'listings';

function setActiveDashTab(tab) {
  currentDashTab = tab;
  document.querySelectorAll('.dash-nav-link').forEach((l) => l.classList.toggle('active', l.dataset.tab === tab));
  const activeGroup = groupForTab(tab);
  document.querySelectorAll('.dash-bottom-nav-item').forEach((b) => b.classList.toggle('active', b.dataset.group === activeGroup));
}

function selectDashTab(tab) {
  setActiveDashTab(tab);
  renderTab(tab);
  closeDashDrawer();
}

function closeDashDrawer() {
  document.getElementById('dash-drawer-overlay').classList.remove('open');
}

function openDashDrawer(groupKey) {
  const group = DASH_NAV_GROUPS[groupKey];
  const drawer = document.getElementById('dash-drawer');
  drawer.innerHTML = `
    <div class="dash-drawer-handle"></div>
    <div class="dash-drawer-title">${escapeHtml(group.label)}</div>
    ${group.tabs.map(([t, label]) => navLinkHtml(t, label)).join('')}
  `;
  drawer.querySelectorAll('.dash-nav-link').forEach((link) => {
    link.addEventListener('click', () => selectDashTab(link.dataset.tab));
  });
  setActiveDashTab(currentDashTab);
  document.getElementById('dash-drawer-overlay').classList.add('open');
}

document.getElementById('dash-drawer-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'dash-drawer-overlay') closeDashDrawer();
});
document.querySelectorAll('.dash-bottom-nav-item').forEach((btn) => {
  btn.addEventListener('click', () => openDashDrawer(btn.dataset.group));
});

(async () => {
  try {
    const termsStatus = await apiFetch('/api/terms/status/');
    if (termsStatus.needs_acceptance) {
      document.getElementById('terms-banner').innerHTML = `
        <div class="alert alert-info" style="display:flex; align-items:center; justify-content:space-between; gap: var(--space-3); flex-wrap:wrap; margin-bottom:var(--space-4);">
          <span>Our <a href="terms.html" target="_blank" style="font-weight:600;">Terms &amp; Conditions</a> have been updated (v${escapeHtml(termsStatus.current_version)}). Please review and re-accept to continue.</span>
          <button class="btn btn-sm" id="terms-reaccept-btn">I accept</button>
        </div>
      `;
      document.getElementById('terms-reaccept-btn').addEventListener('click', async (e) => {
        e.target.disabled = true;
        try {
          await apiFetch('/api/terms/accept/', { method: 'POST', body: { version: termsStatus.current_version } });
          document.getElementById('terms-banner').innerHTML = '';
        } catch (err) {
          alert(formatApiError(err));
          e.target.disabled = false;
        }
      });
    }
  } catch (e) { /* non-fatal */ }
})();

document.querySelectorAll('.dash-nav-link').forEach((link) => {
  link.addEventListener('click', () => selectDashTab(link.dataset.tab));
});

/* Country -> Region -> District hierarchy (real Tanzanian administrative
   regions/districts, a representative subset -- not exhaustive of every
   ward). City/area stays free text since hand-curating every ward
   accurately isn't practical; this still replaces pure free-text entry
   for the region/district levels, which is where search/filter
   fragmentation ("Dar es Salaam" vs "DSM" vs "Dar-es-Salaam") mattered most. */
const TZ_LOCATIONS = {
  'Dar es Salaam': ['Ilala', 'Kinondoni', 'Temeke', 'Ubungo', 'Kigamboni'],
  'Arusha': ['Arusha City', 'Arusha (Meru)', 'Monduli', 'Karatu', 'Longido'],
  'Dodoma': ['Dodoma City', 'Bahi', 'Chamwino', 'Kondoa', 'Mpwapwa'],
  'Mwanza': ['Nyamagana', 'Ilemela', 'Sengerema', 'Magu', 'Kwimba'],
  'Mbeya': ['Mbeya City', 'Mbeya Rural', 'Rungwe', 'Kyela', 'Chunya'],
  'Kilimanjaro': ['Moshi Municipal', 'Moshi Rural', 'Hai', 'Rombo', 'Same'],
  'Tanga': ['Tanga City', 'Korogwe', 'Muheza', 'Lushoto', 'Pangani'],
  'Morogoro': ['Morogoro Municipal', 'Kilosa', 'Mvomero', 'Kilombero', 'Ulanga'],
  'Zanzibar Urban/West': ['Mjini', 'Magharibi A', 'Magharibi B'],
  'Zanzibar North': ['Kaskazini A', 'Kaskazini B'],
  'Mtwara': ['Mtwara Municipal', 'Masasi', 'Newala', 'Nanyumbu'],
  'Iringa': ['Iringa Municipal', 'Kilolo', 'Mufindi', 'Iringa Rural'],
};

/* Ward/area level -- only populated for districts we're confident giving
   exhaustive-sounding real data for (Dar es Salaam's 5 districts). Every
   other district falls back to the free-text City/area field below
   rather than us guessing at ward names we're not sure of. */
const TZ_WARDS = {
  'Ilala': ['Kariakoo', 'Upanga', 'Kivukoni', 'Buguruni', 'Jangwani', 'Kisutu'],
  'Kinondoni': ['Msasani', 'Mikocheni', 'Sinza', 'Kawe', 'Tandale', 'Magomeni'],
  'Temeke': ['Mbagala', "Chang'ombe", 'Keko', 'Kurasini', 'Miburani'],
  'Ubungo': ['Ubungo', 'Kimara', 'Manzese', 'Makuburi', 'Kwembe'],
  'Kigamboni': ['Kigamboni', 'Vijibweni', 'Kibada'],
};

/* Mounts a Region / District / (Ward, where we have real data) / City
   picker into `container`, writing a formatted
   "City, Ward, District, Region" string into a hidden input with id
   `hiddenId`. `currentValue` (existing free-text location data) is put
   into the City/area field as a fallback if it doesn't match a known
   region -- so old data isn't discarded, just not parsed into the
   hierarchy. Shared between the seller create-listing form and the
   listing edit form. */
function mountLocationPicker(container, hiddenId, currentValue) {
  const regions = Object.keys(TZ_LOCATIONS);
  let prefillRegion = '';
  let prefillDistrict = '';
  let prefillWard = '';
  let prefillCity = currentValue || '';
  const parts = (currentValue || '').split(',').map((s) => s.trim()).filter(Boolean);
  if (parts.length) {
    const matchedRegion = regions.find((r) => parts[parts.length - 1] === r);
    if (matchedRegion) {
      prefillRegion = matchedRegion;
      let rest = parts.slice(0, -1);
      if (rest.length && TZ_LOCATIONS[matchedRegion].includes(rest[rest.length - 1])) {
        prefillDistrict = rest[rest.length - 1];
        rest = rest.slice(0, -1);
      }
      if (prefillDistrict && (TZ_WARDS[prefillDistrict] || []).includes(rest[rest.length - 1])) {
        prefillWard = rest[rest.length - 1];
        rest = rest.slice(0, -1);
      }
      prefillCity = rest.join(', ');
    }
  }

  container.innerHTML = `
    <div style="display:flex; gap: var(--space-2); flex-wrap:wrap;">
      <select id="${hiddenId}-region" style="flex:1; min-width:120px;">
        <option value="">Region&hellip;</option>
        ${regions.map((r) => `<option value="${escapeHtml(r)}" ${r === prefillRegion ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}
      </select>
      <select id="${hiddenId}-district" style="flex:1; min-width:120px;">
        <option value="">District&hellip;</option>
      </select>
    </div>
    <div id="${hiddenId}-ward-wrap" class="hidden" style="margin-top: var(--space-2);">
      <select id="${hiddenId}-ward" style="width:100%;"><option value="">Ward&hellip;</option></select>
    </div>
    <input type="text" id="${hiddenId}-city" placeholder="City / area (optional)" value="${escapeHtml(prefillCity)}" style="margin-top: var(--space-2);">
    <input type="hidden" id="${hiddenId}">
  `;

  const regionSelect = document.getElementById(`${hiddenId}-region`);
  const districtSelect = document.getElementById(`${hiddenId}-district`);
  const wardWrap = document.getElementById(`${hiddenId}-ward-wrap`);
  const wardSelect = document.getElementById(`${hiddenId}-ward`);
  const cityInput = document.getElementById(`${hiddenId}-city`);
  const hiddenInput = document.getElementById(hiddenId);

  const populateDistricts = (selected) => {
    const districts = TZ_LOCATIONS[regionSelect.value] || [];
    districtSelect.innerHTML = `<option value="">District&hellip;</option>` +
      districts.map((d) => `<option value="${escapeHtml(d)}" ${d === selected ? 'selected' : ''}>${escapeHtml(d)}</option>`).join('');
  };
  const populateWards = (selected) => {
    const wards = TZ_WARDS[districtSelect.value] || [];
    if (!wards.length) {
      wardWrap.classList.add('hidden');
      wardSelect.innerHTML = `<option value="">Ward&hellip;</option>`;
      return;
    }
    wardWrap.classList.remove('hidden');
    wardSelect.innerHTML = `<option value="">Ward&hellip;</option>` +
      wards.map((w) => `<option value="${escapeHtml(w)}" ${w === selected ? 'selected' : ''}>${escapeHtml(w)}</option>`).join('');
  };
  populateDistricts(prefillDistrict);
  populateWards(prefillWard);

  const syncHidden = () => {
    const bits = [cityInput.value.trim(), wardSelect.value, districtSelect.value, regionSelect.value].filter(Boolean);
    hiddenInput.value = bits.join(', ');
  };
  regionSelect.addEventListener('change', () => { populateDistricts(''); populateWards(''); syncHidden(); });
  districtSelect.addEventListener('change', () => { populateWards(''); syncHidden(); });
  wardSelect.addEventListener('change', syncHidden);
  cityInput.addEventListener('input', syncHidden);
  syncHidden();
}

function pillForStatus(status, map) {
  return `<span class="pill ${map[status] || 'pill-draft'}">${escapeHtml((status || '').replace('_', ' '))}</span>`;
}

async function loadMe() {
  const el = document.getElementById('me-card');
  try {
    const me = await apiFetch('/api/accounts/me/');
    Auth.setSession({ user: me });
    const kycMap = { verified: 'pill-verified', pending: 'pill-pending', rejected: 'pill-rejected', unsubmitted: 'pill-draft' };
    el.innerHTML = `
      <h3 style="margin-bottom:var(--space-1);">${escapeHtml(me.username)}</h3>
      <p class="text-muted" style="margin: 0 0 var(--space-3) 0; font-size:0.85rem;">${escapeHtml(me.email)}</p>
      <p style="font-size:0.85rem;">Role: <strong>${escapeHtml((me.role || '').replace('_', ' '))}</strong></p>
      <p style="font-size:0.85rem;">ID verification: ${pillForStatus(me.id_verification_status, kycMap)}</p>
      ${me.id_verification_status !== 'verified' ? `<p class="form-hint">Submit ID verification (via the API's /api/accounts/kyc/ endpoint) before you can sell.</p>` : ''}
    `;
  } catch (err) {
    el.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function loadWallet() {
  const el = document.getElementById('wallet-card');
  try {
    const data = await apiFetch('/api/wallet/me/');
    const held = Number(data.wallet.pending_balance);
    el.innerHTML = `
      <p class="text-muted" style="margin: 0 0 var(--space-1) 0; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.06em;">Available to withdraw</p>
      <div class="wallet-balance">${Number(data.wallet.available_balance).toLocaleString()} <span class="wallet-currency">${escapeHtml(data.wallet.currency)}</span></div>
      ${held > 0 ? `<p class="form-hint">${held.toLocaleString()} ${escapeHtml(data.wallet.currency)} held from recent sales, releases automatically after the payout hold period.</p>` : ''}
      <p class="form-hint">${data.recent_transactions.length} recent transaction(s)</p>
    `;
  } catch (err) {
    el.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function renderTab(tab) {
  const content = document.getElementById('tab-content');
  content.innerHTML = `<p class="text-muted"><span class="spinner"></span> Loading&hellip;</p>`;

  if (tab === 'listings') return renderListingsTab(content);
  if (tab === 'create') return renderCreateTab(content);
  if (tab === 'verification') return renderVerificationTab(content);
  if (tab === 'purchases') return renderPurchasesTab(content);
  if (tab === 'bookmarks') return renderBookmarksTab(content);
  if (tab === 'following') return renderFollowingTab(content);
  if (tab === 'withdrawals') return renderWithdrawalsTab(content);
  if (tab === 'support') return renderSupportTab(content);
  if (tab === 'subscriptions') return renderSubscriptionsTab(content);
  if (tab === 'alerts') return renderAlertsTab(content);
  if (tab === 'developer') return renderDeveloperTab(content);
}

async function renderListingsTab(content) {
  const statusMap = { published: 'pill-verified', draft: 'pill-draft', submitted: 'pill-pending', suspended: 'pill-rejected', removed: 'pill-rejected', sold_out: 'pill-verified' };
  try {
    const data = await apiFetch('/api/news/listings/?mine=1');
    const results = data.results || data;
    if (!results.length) {
      content.innerHTML = `<div class="empty-state"><h3>No listings yet</h3><p>Use the "Sell News" tab to publish your first verified story.</p></div>`;
      return;
    }
    content.innerHTML = results.map((l) => `
      <div class="card" style="padding: var(--space-5) var(--space-5); margin-bottom:var(--space-3);">
        <div class="flex-between">
          <div>
            <h3 style="margin: 0 0 var(--space-2) 0;">${escapeHtml(l.title)}</h3>
            <p class="text-muted" style="margin:0; font-size:0.85rem;">${money(l.price, l.currency)} &middot; ${escapeHtml(l.purchase_count)} sold &middot; ${escapeHtml(l.view_count)} views &middot; ${l.cover_image ? '1+' : '0'} media</p>
          </div>
          <div style="text-align:right;">
            ${pillForStatus(l.status, statusMap)}
            <div style="margin-top:var(--space-2);">
              ${l.status === 'draft' ? `<button class="btn btn-sm submit-btn" data-slug="${l.slug}">Submit for review</button>` : ''}
              <button class="btn btn-ghost btn-sm edit-toggle-btn" data-slug="${l.slug}">Edit</button>
              <button class="btn btn-ghost btn-sm media-toggle-btn" data-slug="${l.slug}">Add media</button>
              ${l.status === 'published' ? `<button class="btn btn-ghost btn-sm correction-toggle-btn" data-slug="${l.slug}">Issue correction</button>` : ''}
              <a href="listing.html?slug=${encodeURIComponent(l.slug)}" class="btn btn-ghost btn-sm">View</a>
            </div>
          </div>
        </div>
        <div class="edit-listing-area hidden" id="edit-area-${l.slug}" style="margin-top: var(--space-4); padding-top: var(--space-4); border-top:1px solid var(--color-border);"></div>
        <div class="correction-area hidden" id="correction-area-${l.slug}" style="margin-top: var(--space-4); padding-top: var(--space-4); border-top:1px solid var(--color-border);">
          <div id="correction-alert-${l.slug}"></div>
          <div id="correction-history-${l.slug}"></div>
          <form class="correction-form" data-slug="${l.slug}">
            <div class="form-group">
              <label for="correction-text-${l.slug}">Correction text (visible to everyone, and emailed to every past buyer)</label>
              <textarea id="correction-text-${l.slug}" style="min-height:60px;" required></textarea>
            </div>
            <label style="font-size:0.85rem; display:flex; align-items:center; gap: var(--space-2); margin-bottom:var(--space-3);">
              <input type="checkbox" id="correction-retraction-${l.slug}" style="width:auto;">
              This is a retraction (the story is materially wrong, not just amended)
            </label>
            <button type="submit" class="btn btn-sm">Post correction</button>
          </form>
        </div>
        <div class="media-upload-area hidden" id="media-area-${l.slug}" style="margin-top: var(--space-4); padding-top: var(--space-4); border-top:1px solid var(--color-border);">
          <div id="media-alert-${l.slug}"></div>
          <form class="media-form" data-slug="${l.slug}">
            <div class="field-row">
              <div class="form-group">
                <label for="media-type-${l.slug}">Media type</label>
                <select id="media-type-${l.slug}">
                  <option value="image">Image</option>
                  <option value="video">Video</option>
                  <option value="document">Document</option>
                </select>
              </div>
              <div class="form-group">
                <label for="media-file-${l.slug}">File</label>
                <input type="file" id="media-file-${l.slug}" accept="image/*,video/*" required>
              </div>
            </div>
            <label style="font-size:0.85rem; display:flex; align-items:center; gap: var(--space-2); margin-bottom:var(--space-3);">
              <input type="checkbox" id="media-cover-${l.slug}" checked style="width:auto;">
              Use as cover image
            </label>
            <details style="margin-bottom:var(--space-3);">
              <summary style="cursor:pointer; font-size:0.82rem; color:var(--color-text-muted);">Wire metadata (optional)</summary>
              <div class="field-row" style="margin-top: var(--space-3);">
                <div class="form-group">
                  <label for="media-credit-${l.slug}">Credit line</label>
                  <input type="text" id="media-credit-${l.slug}" placeholder="Photo: Jane Reporter / WEMIX">
                </div>
                <div class="form-group">
                  <label for="media-keywords-${l.slug}">Keywords</label>
                  <input type="text" id="media-keywords-${l.slug}" placeholder="comma, separated, keywords">
                </div>
              </div>
              <div class="field-row">
                <div class="form-group">
                  <label for="media-capture-date-${l.slug}">Capture date</label>
                  <input type="datetime-local" id="media-capture-date-${l.slug}">
                </div>
                <div class="form-group">
                  <label for="media-gps-${l.slug}">GPS (lat, lng)</label>
                  <input type="text" id="media-gps-${l.slug}" placeholder="-6.792354, 39.208328">
                </div>
              </div>
            </details>
            <button type="submit" class="btn btn-sm">Upload</button>
          </form>
        </div>
      </div>
    `).join('');

    content.querySelectorAll('.edit-toggle-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const slug = btn.dataset.slug;
        const area = document.getElementById(`edit-area-${slug}`);
        const isHidden = area.classList.contains('hidden');
        area.classList.toggle('hidden');
        if (isHidden && !area.dataset.loaded) loadEditForm(slug, area);
      });
    });

    content.querySelectorAll('.correction-toggle-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const slug = btn.dataset.slug;
        const area = document.getElementById(`correction-area-${slug}`);
        const isHidden = area.classList.contains('hidden');
        area.classList.toggle('hidden');
        if (isHidden && !area.dataset.loaded) loadCorrectionHistory(slug, area);
      });
    });
    content.querySelectorAll('.correction-form').forEach((form) => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const slug = form.dataset.slug;
        const alertBox = document.getElementById(`correction-alert-${slug}`);
        alertBox.innerHTML = '';
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        try {
          await apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/corrections/`, {
            method: 'POST',
            body: {
              text: document.getElementById(`correction-text-${slug}`).value,
              is_retraction: document.getElementById(`correction-retraction-${slug}`).checked,
            },
          });
          alertBox.innerHTML = `<div class="alert alert-success">Posted, and past buyers have been notified.</div>`;
          form.reset();
          const area = document.getElementById(`correction-area-${slug}`);
          area.dataset.loaded = '';
          loadCorrectionHistory(slug, area);
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
        } finally {
          submitBtn.disabled = false;
        }
      });
    });

    content.querySelectorAll('.submit-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';
        try {
          await apiFetch(`/api/news/listings/${encodeURIComponent(btn.dataset.slug)}/submit/`, { method: 'POST' });
          renderListingsTab(content);
        } catch (err) {
          alert(formatApiError(err));
          btn.disabled = false;
          btn.textContent = 'Submit for review';
        }
      });
    });

    content.querySelectorAll('.media-toggle-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.getElementById(`media-area-${btn.dataset.slug}`).classList.toggle('hidden');
      });
    });

    content.querySelectorAll('.media-form').forEach((form) => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const slug = form.dataset.slug;
        const alertBox = document.getElementById(`media-alert-${slug}`);
        const submitBtn = form.querySelector('button[type="submit"]');
        const fileInput = document.getElementById(`media-file-${slug}`);
        alertBox.innerHTML = '';

        if (!fileInput.files.length) {
          alertBox.innerHTML = `<div class="alert alert-error">Choose a file first.</div>`;
          return;
        }

        const formData = new FormData();
        formData.append('media_type', document.getElementById(`media-type-${slug}`).value);
        formData.append('file', fileInput.files[0]);
        formData.append('is_cover', document.getElementById(`media-cover-${slug}`).checked);

        const creditLine = document.getElementById(`media-credit-${slug}`).value.trim();
        if (creditLine) formData.append('credit_line', creditLine);
        const keywords = document.getElementById(`media-keywords-${slug}`).value.trim();
        if (keywords) formData.append('keywords', keywords);
        const captureDate = document.getElementById(`media-capture-date-${slug}`).value;
        if (captureDate) formData.append('capture_date', captureDate);
        const gps = document.getElementById(`media-gps-${slug}`).value.trim();
        if (gps && gps.includes(',')) {
          const [lat, lng] = gps.split(',').map((s) => s.trim());
          if (lat) formData.append('gps_latitude', lat);
          if (lng) formData.append('gps_longitude', lng);
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Uploading&hellip;';
        try {
          await apiFetch(`/api/news/listings/${encodeURIComponent(slug)}/media/`, {
            method: 'POST', body: formData, isForm: true,
          });
          alertBox.innerHTML = `<div class="alert alert-success">Media uploaded.</div>`;
          setTimeout(() => renderListingsTab(content), 900);
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Upload';
        }
      });
    });
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function loadCorporateCard(me) {
  const card = document.getElementById('corporate-card');
  if (!card) return;
  const kybMap = { verified: 'pill-verified', pending: 'pill-pending', rejected: 'pill-rejected' };
  try {
    const data = await apiFetch('/api/accounts/corporate-verifications/');
    const submissions = data.results || data;
    const latest = submissions[0];

    card.innerHTML = `
      <div class="flex-between" style="margin-bottom:var(--space-1);">
        <h4 style="margin:0;">Corporate account</h4>
        ${me.is_corporate ? '<span class="pill pill-verified">&#10003; Verified organization</span>' : (latest ? pillForStatus(latest.status, kybMap) : '')}
      </div>
      <p class="text-muted" style="margin-top:0; font-size:0.85rem;">Buying on behalf of an organization instead of as an individual? Submit your business documents for verification.</p>
      ${me.is_corporate ? '' : `
        <div id="corporate-alert"></div>
        <form id="corporate-form">
          <div class="form-group">
            <label for="corp-name">Company name</label>
            <input type="text" id="corp-name" required>
          </div>

            <div class="form-group">

              <label for="corp-registration">Company registration certificate</label>
              <input type="file" id="corp-registration" required>
            </div>
          </div>
          <div class="form-group">
            <label for="corp-tax">Tax document (optional)</label>
            <input type="file" id="corp-tax">
          </div>
          <button type="submit" class="btn btn-sm" id="corp-submit-btn">Submit for verification</button>
        </form>
      `}
      ${submissions.length ? `
        <h5 style="margin: var(--space-4) 0 var(--space-2) 0;">Submission history</h5>
        ${submissions.map((s) => `
          <div class="table-row">
            <span>${escapeHtml(s.company_name)}</span>

        const btn = document.getElementById('corp-submit-btn');

        const license = document.getElementById('corp-license').files[0];
        const registration = document.getElementById('corp-registration').files[0];
        const tax = document.getElementById('corp-tax').files[0];
        if (!license || !registration) {
          alertBox.innerHTML = `<div class="alert alert-error">Business license and company registration are both required.</div>`;
          return;
        }
        const formData = new FormData();
        formData.append('company_name', document.getElementById('corp-name').value);
        formData.append('business_license', license);
        formData.append('company_registration', registration);
        if (tax) formData.append('tax_document', tax);

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Submitting&hellip;';
        try {
          await apiFetch('/api/accounts/corporate-verifications/', { method: 'POST', body: formData, isForm: true });
          alertBox.innerHTML = `<div class="alert alert-success">Submitted. A moderator will review it shortly.</div>`;
          setTimeout(() => loadCorporateCard(me), 1200);
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
          btn.disabled = false;
          btn.textContent = 'Submit for verification';
        }
      });
    }
  } catch (err) {
    card.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

  }

    e.preventDefault();

    const btn = document.getElementById('create-btn');
    alertBox.innerHTML = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Saving&hellip;';

    try {
      await apiFetch('/api/news/listings/', {
        method: 'POST',
        body: {
          title: document.getElementById('title').value,
          description: document.getElementById('description').value,
          meta_description: document.getElementById('meta_description').value,
          body: document.getElementById('body').value,

          dateline: document.getElementById('dateline').value,
          news_type: document.getElementById('news_type').value,
          category: document.getElementById('category').value,
          location: document.getElementById('location').value,
          price: document.getElementById('price').value,
          license_type: document.getElementById('license-type').value,
          license_territory: document.getElementById('license-territory').value,
        },
      });
      alertBox.innerHTML = `<div class="alert alert-success">Draft created. Switch to "My Listings" to submit it for review.</div>`;
      document.getElementById('create-form').reset();
      mountLocationPicker(document.getElementById('location-wrap'), 'location', '');
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save as draft';
    }
  });
}

async function renderPurchasesTab(content) {

      return;
    }
    const statusMap = { paid: 'pill-verified', pending_payment: 'pill-pending', failed: 'pill-rejected', cancelled: 'pill-rejected', refunded: 'pill-draft' };
    content.innerHTML = results.map((o) => `
      <div class="card card-compact" style="margin-bottom:var(--space-2);">
        <div class="flex-between" style="align-items:center; flex-wrap:wrap; gap: var(--space-2);">

          </div>
          ${o.status === 'paid' ? `<button class="btn btn-outline btn-sm refund-request-btn" data-order-id="${o.id}" data-title="${escapeHtml(o.listing_title)}">Request refund</button>` : ''}
        </div>
        <div class="refund-form-area hidden" id="refund-form-${o.id}" style="margin-top:var(--space-3); padding-top:var(--space-3); border-top:1px solid var(--color-border);"></div>
      </div>
    `).join('');

    content.querySelectorAll('.refund-request-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const orderId = btn.dataset.orderId;
        const area = document.getElementById(`refund-form-${orderId}`);
        if (!area.classList.contains('hidden')) { area.classList.add('hidden'); return; }
        area.classList.remove('hidden');
        area.innerHTML = `
          <div id="refund-alert-${orderId}"></div>
          <div class="form-group">
            <label for="refund-reason-${orderId}">Why are you requesting a refund for "${btn.dataset.title}"?</label>
            <textarea id="refund-reason-${orderId}" style="min-height:60px;" required></textarea>
          </div>
          <button class="btn btn-sm" id="refund-submit-${orderId}">Submit refund request</button>
        `;
        document.getElementById(`refund-submit-${orderId}`).addEventListener('click', async () => {
          const alertBox = document.getElementById(`refund-alert-${orderId}`);
          const reason = document.getElementById(`refund-reason-${orderId}`).value.trim();
          alertBox.innerHTML = '';
          if (!reason) {
            alertBox.innerHTML = `<div class="alert alert-error">Please explain why you're requesting a refund.</div>`;
            return;
          }
          try {
            await apiFetch('/api/payments/refunds/', { method: 'POST', body: { order: orderId, reason } });
            area.innerHTML = `<div class="alert alert-success">Refund request submitted. A moderator will review it.</div>`;
          } catch (err) {
            alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
          }
        });
      });
    });
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

async function renderSupportTab(content) {
  content.innerHTML = `
    <div class="card" style="padding:var(--space-5); margin-bottom:var(--space-5);">
      <h3 style="margin-top:0;">New support request</h3>
      <div id="ticket-alert"></div>
      <form id="ticket-form">
        <div class="field-row">
          <div class="form-group">
            <label for="ticket-category">Category</label>
            <select id="ticket-category">
              <option value="question">Question</option>
              <option value="complaint">Complaint</option>
              <option value="refund_help">Refund help</option>
              <option value="compliment">Compliment</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="ticket-subject">Subject</label>
            <input type="text" id="ticket-subject" required>
          </div>
        </div>
        <div class="form-group">
          <label for="ticket-message">Message</label>
          <textarea id="ticket-message" style="min-height:70px;" required></textarea>
        </div>
        <button type="submit" class="btn btn-sm" id="ticket-submit-btn">Submit</button>
      </form>
    </div>
    <h4 style="margin-bottom: var(--space-3);">My tickets</h4>
    <div id="ticket-list"><p class="text-muted"><span class="spinner"></span> Loading&hellip;</p></div>
  `;

  const statusMap = { open: 'pill-pending', in_progress: 'pill-pending', resolved: 'pill-verified', closed: 'pill-draft' };

  const loadTickets = async () => {
    const listEl = document.getElementById('ticket-list');
    try {
      const data = await apiFetch('/api/support-tickets/');
      const results = data.results || data;
      if (!results.length) {
        listEl.innerHTML = `<div class="empty-state"><h3>No tickets yet</h3><p>Questions, complaints, refund help, or compliments -- submit one above.</p></div>`;
        return;
      }
      listEl.innerHTML = results.map((t) => `
        <div class="card card-compact" style="margin-bottom: var(--space-3);">
          <div class="flex-between" style="align-items:flex-start;">
            <div>
              <strong>${escapeHtml(t.subject)}</strong>
              <span class="pill pill-draft" style="margin-left: var(--space-2);">${escapeHtml((t.category || '').replace('_', ' '))}</span>
              ${pillForStatus(t.status, statusMap)}
              <p class="text-muted" style="margin: var(--space-2) 0 0 0; font-size:0.85rem;">${escapeHtml(t.message)}</p>
              <p class="text-muted" style="margin: var(--space-1) 0 0 0; font-size:0.78rem;">${timeAgo(t.created_at)}</p>
            </div>
          </div>
          ${(t.messages || []).length ? `
            <div style="margin-top: var(--space-3); padding-top: var(--space-3); border-top:1px solid var(--color-border); display:flex; flex-direction:column; gap: var(--space-2);">
              ${t.messages.map((m) => `
                <div style="font-size:0.85rem;">
                  <strong>${m.is_staff_reply ? 'Support' : escapeHtml(m.author_username)}:</strong>
                  <span>${escapeHtml(m.message)}</span>
                  <span class="text-muted" style="font-size:0.72rem;"> &middot; ${timeAgo(m.created_at)}</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
          ${t.status !== 'closed' ? `
            <div style="margin-top: var(--space-3); display:flex; gap: var(--space-2);">
              <input type="text" class="ticket-reply-input" data-id="${t.id}" placeholder="Add a reply&hellip;" style="flex:1; padding:var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.85rem;">
              <button class="btn btn-sm ticket-reply-btn" data-id="${t.id}">Send</button>
            </div>
          ` : ''}
        </div>
      `).join('');

      listEl.querySelectorAll('.ticket-reply-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const input = document.querySelector(`.ticket-reply-input[data-id="${id}"]`);
          const message = input.value.trim();
          if (!message) return;
          btn.disabled = true;
          try {
            await apiFetch(`/api/support-tickets/${id}/reply/`, { method: 'POST', body: { message } });
            loadTickets();
          } catch (err) {
            alert(formatApiError(err));
            btn.disabled = false;
          }
        });
      });
    } catch (err) {
      listEl.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    }
  };

  document.getElementById('ticket-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('ticket-alert');
    const btn = document.getElementById('ticket-submit-btn');
    alertBox.innerHTML = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Submitting&hellip;';
    try {
      await apiFetch('/api/support-tickets/', {
        method: 'POST',
        body: {
          category: document.getElementById('ticket-category').value,
          subject: document.getElementById('ticket-subject').value,
          message: document.getElementById('ticket-message').value,
        },
      });
      document.getElementById('ticket-form').reset();
      alertBox.innerHTML = `<div class="alert alert-success">Submitted.</div>`;
      loadTickets();
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit';
    }
  });

  loadTickets();
}

        </div>
      ` : ''}

      <h4 style="margin-bottom: var(--space-3);">Sellers I'm subscribed to</h4>
      <div id="my-subs-list">
        ${mine.length ? mine.map((s) => `
          <div class="card card-compact" style="margin-bottom:var(--space-2);">
            <div class="flex-between">
              <div>
                <strong>${escapeHtml(s.seller_username)}</strong> &middot; ${money(s.price)}/mo
                <p class="text-muted" style="margin: var(--space-1) 0 0 0; font-size:0.82rem;">${pillForStatus(s.status, statusMap)} ${s.current_period_end ? '&middot; renews/ends ' + new Date(s.current_period_end).toLocaleDateString() : ''}</p>
              </div>
              ${s.status === 'active' ? `<button class="btn btn-outline btn-sm sub-cancel-btn" data-id="${s.id}">Cancel</button>` : ''}
            </div>
          </div>
        `).join('') : '<p class="text-muted">Not subscribed to anyone yet -- subscribe from a seller\'s listing page.</p>'}
      </div>
    `;

    if (isSeller) {
      document.getElementById('sub-price-save').addEventListener('click', async () => {
        const alertBox = document.getElementById('sub-price-alert');
        alertBox.innerHTML = '';
        const val = document.getElementById('sub-price-input').value;
        try {
          await apiFetch('/api/accounts/me/', { method: 'PATCH', body: { subscription_price: val || null } });
          alertBox.innerHTML = `<div class="alert alert-success">Saved.</div>`;
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
        }
      });
    }

    content.querySelectorAll('.sub-cancel-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Cancel this subscription? You\'ll keep access until the current period ends.')) return;
        try {
          await apiFetch(`/api/payments/subscriptions/${btn.dataset.id}/cancel/`, { method: 'POST' });
          renderSubscriptionsTab(content);
        } catch (err) {
          alert(formatApiError(err));
        }
      });
    });
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
  }
}

/* ---------------------------------------------------------------------- */
/* ALERTS (saved searches) tab                                             */
/* ---------------------------------------------------------------------- */

async function renderAlertsTab(content) {
  content.innerHTML = `
    <div class="card" style="padding:var(--space-5); margin-bottom:var(--space-5);">
      <h3 style="margin-top:0;">New alert</h3>
      <p class="text-muted" style="margin-top:-8px;">Get notified the moment a new verified story matches your filter.</p>
      <div id="alert-create-alert"></div>
      <form id="alert-create-form">
        <div class="field-row">
          <div class="form-group">
            <label for="alert-name">Label</label>
            <input type="text" id="alert-name" placeholder="e.g. Dar es Salaam politics">
          </div>
          <div class="form-group">
            <label for="alert-news-type">Type</label>
            <select id="alert-news-type">
              <option value="">Any</option>
              <option value="text">Text News</option>
              <option value="breaking">Breaking News</option>
              <option value="investigative">Investigative Report</option>
              <option value="political">Political</option>
              <option value="business">Business</option>
              <option value="sports">Sports</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="form-group">
            <label for="alert-location">Location contains</label>
            <input type="text" id="alert-location" placeholder="e.g. Dar es Salaam">
          </div>
          <div class="form-group">
            <label for="alert-max-price">Max price (TZS)</label>
            <input type="number" id="alert-max-price" min="0">
          </div>
        </div>
        <button type="submit" class="btn btn-sm">Create alert</button>
      </form>
    </div>
    <h4 style="margin-bottom: var(--space-3);">My alerts</h4>
    <div id="alert-list"><p class="text-muted"><span class="spinner"></span> Loading&hellip;</p></div>
  `;

  const load = async () => {
    const listEl = document.getElementById('alert-list');
    try {
      const data = await apiFetch('/api/news/saved-searches/');
      const results = data.results || data;
      listEl.innerHTML = results.length ? results.map((a) => `
        <div class="table-row">
          <span>${escapeHtml(a.name || 'Untitled alert')}</span>
          <span class="text-muted">${escapeHtml((a.news_type || 'any type').replace('_', ' '))}${a.location_contains ? ' &middot; ' + escapeHtml(a.location_contains) : ''}</span>
          <span>${a.is_active ? '<span class="pill pill-verified">active</span>' : '<span class="pill pill-draft">paused</span>'}</span>
          <span><button class="btn btn-ghost btn-sm alert-delete-btn" data-id="${a.id}">Delete</button></span>
        </div>
      `).join('') : '<p class="text-muted">No alerts yet.</p>';

      listEl.querySelectorAll('.alert-delete-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          try {
            await apiFetch(`/api/news/saved-searches/${btn.dataset.id}/`, { method: 'DELETE' });
            load();
          } catch (err) {
            alert(formatApiError(err));
          }
        });
      });
    } catch (err) {
      listEl.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    }
  };

  document.getElementById('alert-create-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alert-create-alert');
    alertBox.innerHTML = '';
    try {
      await apiFetch('/api/news/saved-searches/', {
        method: 'POST',
        body: {
          name: document.getElementById('alert-name').value,
          news_type: document.getElementById('alert-news-type').value,
          location_contains: document.getElementById('alert-location').value,
          max_price: document.getElementById('alert-max-price').value || null,
        },
      });
      document.getElementById('alert-create-form').reset();
      load();
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    }
  });

  load();
}

/* ---------------------------------------------------------------------- */
/* DEVELOPER (API keys + data export) tab                                  */
/* ---------------------------------------------------------------------- */

async function renderDeveloperTab(content) {
  content.innerHTML = `
    <div class="card" style="padding:var(--space-5); margin-bottom:var(--space-5);">
      <h3 style="margin-top:0;">Your data</h3>
      <p class="text-muted" style="margin-top:-8px;">Download everything WEMIX has on your account -- profile, listings, orders, wallet history, and more -- as a JSON file.</p>
      <button class="btn btn-outline btn-sm" id="export-data-btn">Export my data</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">API keys</h3>
      <p class="text-muted" style="margin-top:-8px;">For enterprise/newsroom integrations that need programmatic access instead of a browser login. Send it as <code>Authorization: Api-Key &lt;key&gt;</code>.</p>
      <div id="apikey-alert"></div>
      <div class="field-row">
        <div class="form-group">
          <label for="apikey-name">Label</label>
          <input type="text" id="apikey-name" placeholder="e.g. Newsroom ingest script">
        </div>
      </div>
      <button class="btn btn-sm" id="apikey-create-btn">Generate new key</button>
      <div id="apikey-new-value" style="margin-top:var(--space-3);"></div>
      <h4 style="margin-top:var(--space-5); margin-bottom: var(--space-3);">Your keys</h4>
      <div id="apikey-list"></div>
    </div>
  `;

  document.getElementById('export-data-btn').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
      const resp = await fetch(`${API_BASE_URL}/api/accounts/me/export/`, {
        headers: { Authorization: `Bearer ${Auth.getAccessToken()}` },
      });
      const blob = await resp.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'wemix-data-export.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    } catch (err) {
      alert('Export failed.');
    } finally {
      btn.disabled = false;
    }
  });

  const loadKeys = async () => {
    const listEl = document.getElementById('apikey-list');
    try {
      const keys = await apiFetch('/api/api-keys/');
      listEl.innerHTML = keys.length ? keys.map((k) => `
        <div class="table-row">
          <span>${escapeHtml(k.name)}</span>
          <span class="text-muted">${escapeHtml(k.prefix)}&hellip;</span>
          <span>${k.is_active ? '<span class="pill pill-verified">active</span>' : '<span class="pill pill-draft">revoked</span>'}</span>
          <span>${k.is_active ? `<button class="btn btn-ghost btn-sm apikey-revoke-btn" data-id="${k.id}">Revoke</button>` : ''}</span>
        </div>
      `).join('') : '<p class="text-muted">No API keys yet.</p>';

      listEl.querySelectorAll('.apikey-revoke-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Revoke this key? Anything using it will stop working immediately.')) return;
          try {
            await apiFetch(`/api/api-keys/${btn.dataset.id}/revoke/`, { method: 'POST' });
            loadKeys();
          } catch (err) {
            alert(formatApiError(err));
          }
        });
      });
    } catch (err) {
      listEl.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    }
  };

  document.getElementById('apikey-create-btn').addEventListener('click', async () => {
    const alertBox = document.getElementById('apikey-alert');
    alertBox.innerHTML = '';
    const name = document.getElementById('apikey-name').value.trim();
    if (!name) {
      alertBox.innerHTML = `<div class="alert alert-error">Give the key a label first.</div>`;
      return;
    }
    try {
      const result = await apiFetch('/api/api-keys/', { method: 'POST', body: { name } });
      document.getElementById('apikey-new-value').innerHTML = `
        <div class="alert alert-success">
          <strong>Copy this now -- it won't be shown again:</strong>
          <div style="display:flex; gap: var(--space-2); align-items:center; margin-top:var(--space-2);">
            <input type="text" readonly value="${escapeHtml(result.raw_key)}" style="flex:1; padding: var(--space-2) var(--space-2); border:1px solid var(--color-border); border-radius:6px; font-size:0.8rem;" id="apikey-raw-input">
            <button class="btn btn-sm" id="apikey-copy-btn">Copy</button>
          </div>
        </div>
      `;
      document.getElementById('apikey-copy-btn').addEventListener('click', () => {
        const input = document.getElementById('apikey-raw-input');
        input.select();
        navigator.clipboard?.writeText(input.value).catch(() => document.execCommand('copy'));
      });
      document.getElementById('apikey-name').value = '';
      loadKeys();
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(formatApiError(err))}</div>`;
    }
  });

  loadKeys();
}

loadMe();
loadWallet();
// Deep-link support: notifications across the app link here with
// ?tab=withdrawals etc. (see core/notifications.py's link_path values)
// -- previously dead, since nothing ever read the query param and every
// such link silently landed on the default "My Listings" tab instead.
const ALL_DASH_TABS = new Set(Object.values(DASH_NAV_GROUPS).flatMap((g) => g.tabs.map(([t]) => t)));
const requestedTab = new URLSearchParams(window.location.search).get('tab');
const initialDashTab = ALL_DASH_TABS.has(requestedTab) ? requestedTab : 'listings';
document.querySelector(`details[data-group="${groupForTab(initialDashTab)}"]`)?.setAttribute('open', '');
setActiveDashTab(initialDashTab);
renderTab(initialDashTab);
</script>
