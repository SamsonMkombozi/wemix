<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEMIX — Global News Market</title>
<meta name="description" content="WEMIX is a verified news marketplace: AI + human-reviewed stories from journalists and media houses, direct from the source.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WEMIX">
<meta property="og:title" content="WEMIX — Global News Market">
<meta property="og:description" content="Verified news, direct from the source. Buy exclusive, fact-checked stories or sell the news you've reported.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="WEMIX — Global News Market">
<meta name="twitter:description" content="Verified news, direct from the source.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ----------------------------------------------------------------------
     WEMIX homepage -- scoped component set (its layout/classes are
     specific to this page), but the palette now resolves to the SAME
     black/white/gold tokens as css/style.css (used by every other page)
     instead of a separate hue set -- one brand across the whole system.
     Page width/side padding use the shared .container class directly
     (css/style.css's 5-tier responsive padding-inline scale) instead of
     a page-local re-implementation, so the homepage's edges line up with
     every other page at every breakpoint. Only .spinner, .hidden,
     .text-muted and similar plain utilities are reused directly from there.
     ---------------------------------------------------------------------- */
  :root {
    --wm-navy: var(--color-black);
    --wm-navy-2: #262626;
    --wm-red: var(--color-gold-secondary);
    --wm-blue: var(--color-gold);
    --wm-text: var(--color-text);
    --wm-muted: var(--color-text-muted);
    --wm-bg-alt: #f6f3ea;
    --wm-border: var(--color-border);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Poppins', sans-serif; color: var(--wm-text); background: #fff; }
  a { text-decoration: none; color: inherit; }
  /* Page width + side padding now come from the shared .container system
     (css/style.css) -- see js/nav.js's topnav for the same pattern. */
  .wm-hidden { display: none !important; }

  /* The top app bar (wordmark + account actions) and the site footer are
     no longer defined per-page -- they're the shared layout in js/nav.js
     (renderNav/renderFooter, injected into #topnav-root/#footer-root),
     the same component every other page in the system already used. See
     js/nav.js and its .topnav/.wm-footer* rules in css/style.css. */

  /* Toolbar -- a single full-width search row directly below the app bar.
     Category select comes first, then the text input, then the search
     button -- an Amazon-style "search within a category" layout, all one
     connected control. The category nav and breaking-news ticker that
     used to live below this (as their own row, then later combined into
     one row with it) have been removed outright per request; "Top
     Categories" further down the page and each listing's own category
     tag remain as the way to browse by category. */
  .wm-toolbar-search-row { background: #fff; border-bottom: 1px solid var(--wm-border); padding-block: var(--space-4); }
  .wm-search-wrap { display: flex; max-width: 640px; position: relative; }
  .wm-search-wrap select {
    border: 1px solid var(--wm-border); border-right: none; border-radius: 6px 0 0 6px;
    padding: var(--space-3) var(--space-3); font-size: 0.82rem; font-family: inherit;
    background: #fafafa; max-width: 150px; min-width: 0; flex-shrink: 0; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  /* The requested "black on hover/selected" treatment -- a native <select>'s
     own dropdown-option list is OS-rendered and not stylable across
     browsers, so this targets the one part that reliably is: the closed
     control itself, which goes black-on-gold (matching .btn's hover) the
     moment it's focused or hovered, not just on open. */
  .wm-search-wrap select:hover, .wm-search-wrap select:focus {
    background: var(--color-black); color: #fff; border-color: var(--color-black); outline: none;
  }
  .wm-search-wrap input { flex: 1; min-width: 0; border: 1px solid var(--wm-border); border-left: none; border-right: none; padding: var(--space-3) var(--space-4); font-size: 0.85rem; font-family: inherit; }
  .wm-search-wrap button { flex-shrink: 0; border: none; background: var(--wm-navy); color: #fff; padding: 0 var(--space-4); border-radius: 0 6px 6px 0; cursor: pointer; }

  /* Live "smart" suggestions -- sellers/journalists matching what's typed
     so far, shown as you type (debounced) and dismissed on blur/Escape/
     pick. A plain text search still runs on submit regardless; this is
     purely a faster path straight to a person instead of their stories. */
  .wm-search-suggest {
    position: absolute; top: 100%; left: 0; right: 44px; margin-top: 4px;
    background: #fff; border: 1px solid var(--wm-border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 30; overflow: hidden;
  }
  .wm-search-suggest-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); cursor: pointer; }
  .wm-search-suggest-item:hover, .wm-search-suggest-item.active { background: var(--color-black); color: #fff; }
  .wm-search-suggest-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--wm-blue); color: var(--color-black); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; flex-shrink: 0; overflow: hidden; }
  .wm-search-suggest-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .wm-search-suggest-name { font-size: 0.85rem; font-weight: 600; }
  .wm-search-suggest-meta { font-size: 0.72rem; opacity: 0.65; text-transform: capitalize; }

  /* Sections -- padding-block only (vertical rhythm between sections).
     A plain `padding: X 0` shorthand here would also zero out left/right,
     unconditionally overriding .container's padding-inline (the shared
     responsive side-gutter every page uses) on every element that carries
     both classes -- which is every section on this page. That's exactly
     what was happening: at wide widths the two-column hero+latest-news
     grid's own margins happened to redistribute the lost gutter back to
     roughly the right place, hiding the bug, but at narrower widths
     (tablet/mobile) every section below the header visibly ran flush to
     the screen edge while the header/nav above it (no .wm-section class)
     kept their padding -- the exact "doesn't start together" symptom. */
  .wm-section { padding-block: var(--space-8); }
  .wm-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }
  .wm-section-title { font-size: 0.95rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--wm-text); }
  .wm-view-all { font-size: 0.78rem; font-weight: 600; color: var(--wm-blue); }

  /* Hero */
  .wm-hero-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: var(--space-6); align-items: start; }
  .wm-hero-card { position: relative; border-radius: 10px; overflow: hidden; min-height: 420px; background: linear-gradient(135deg, var(--wm-navy), #1a1a1a); display: flex; align-items: flex-end; }
  .wm-hero-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .wm-hero-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0.15) 60%); }
  .wm-hero-content { position: relative; z-index: 1; padding: var(--space-7); color: #fff; }
  .wm-hero-tag { display: inline-block; background: var(--wm-blue); color: var(--color-black); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; padding: var(--space-1) var(--space-3); border-radius: 4px; margin-bottom: var(--space-3); }
  .wm-hero-content h1 { font-size: 1.9rem; font-weight: 700; margin: 0 0 var(--space-3) 0; line-height: 1.25; max-width: 640px; }
  .wm-hero-content p { font-size: 0.9rem; color: rgba(255,255,255,0.75); max-width: 560px; margin: 0 0 var(--space-4) 0; }
  .wm-hero-meta { font-size: 0.78rem; color: rgba(255,255,255,0.65); }
  .wm-hero-dots { display: flex; gap: var(--space-2); margin-top: var(--space-4); }
  .wm-hero-dot { width: 20px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.4); cursor: pointer; }
  .wm-hero-dot.active { background: #fff; }
  .wm-hero-next-btn { position: absolute; z-index: 2; top: 50%; right: 16px; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(0,0,0,0.55); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .wm-hero-next-btn:hover { background: rgba(0,0,0,0.8); }
  .wm-hero-next-btn svg { width: 16px; height: 16px; }

  .wm-latest-list { display: flex; flex-direction: column; gap: var(--space-4); }
  .wm-latest-item { display: flex; gap: var(--space-3); align-items: flex-start; }
  .wm-latest-thumb { width: 64px; height: 48px; min-width: 64px; border-radius: 6px; background: var(--wm-bg-alt); overflow: hidden; }
  .wm-latest-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .wm-latest-cat { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.05em; color: var(--wm-blue); text-transform: uppercase; }
  .wm-latest-time { font-size: 0.68rem; color: var(--wm-muted); float: right; }
  .wm-latest-title { font-size: 0.82rem; font-weight: 600; line-height: 1.3; margin-top: var(--space-1); }

  /* Top categories */
  .wm-cat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: var(--space-3); }
  .wm-cat-item { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding: var(--space-4) var(--space-2); cursor: pointer; }
  .wm-cat-item:hover .wm-cat-icon, .wm-cat-item:hover .wm-cat-label { color: var(--wm-blue); }
  .wm-cat-icon { width: 26px; height: 26px; color: var(--wm-navy); }
  .wm-cat-label { font-size: 0.75rem; font-weight: 600; }

  /* Content cards -- shared by Trending; also the row style search results
     fall back to via .wm-result-card below (kept visually related). */
  .wm-trend-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5); }
  .wm-trend-card { position: relative; display: block; }
  .wm-trend-card-media { height: 150px; border-radius: 8px; overflow: hidden; background: var(--wm-bg-alt); margin-bottom: var(--space-3); }
  .wm-trend-card-media img { width: 100%; height: 100%; object-fit: cover; }
  .wm-trend-rank { position: absolute; top: 10px; left: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--wm-navy); color: #fff; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .wm-pick-cat { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; color: var(--wm-blue); text-transform: uppercase; }
  .wm-pick-title { font-size: 0.98rem; font-weight: 700; margin: var(--space-2) 0; line-height: 1.3; }
  .wm-pick-desc { font-size: 0.8rem; color: var(--wm-muted); margin: 0 0 var(--space-2) 0; }
  .wm-pick-time { font-size: 0.72rem; color: var(--wm-muted); }

  /* A full-bleed tinted band, used to give one section visual weight
     against the all-white page without adding another loud color. */
  .wm-section-tint { background: var(--wm-bg-alt); }

  /* Footer is the shared .wm-footer component (css/style.css / js/nav.js
     renderFooter) now -- see the comment at the top of this <style> block. */

  /* Search-results mode (real search/category filtering, swaps out the editorial layout).
     Grid minmax and the card's radius/shadow/hover now match .grid/.listing-card
     (css/style.css) exactly, so these cards read as the same component family as
     every other listing card on the site instead of a page-local variant. */
  .wm-results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-5); }
  .wm-results-people { margin-bottom: var(--space-6); }
  .wm-results-people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-4); }
  .wm-person-card { display: flex; align-items: center; gap: var(--space-3); border: 1px solid var(--wm-border); border-radius: var(--radius-md); padding: var(--space-3); text-decoration: none; color: inherit; transition: border-color 0.2s, transform 0.2s; }
  .wm-person-card:hover { border-color: var(--color-black); transform: translateY(-2px); }
  .wm-person-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--wm-blue); color: var(--color-black); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; flex-shrink: 0; overflow: hidden; }
  .wm-person-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .wm-person-name { font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 4px; }
  .wm-person-meta { font-size: 0.75rem; color: var(--wm-muted); text-transform: capitalize; }
  .wm-result-card { border: 1px solid var(--wm-border); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s; display: block; }
  .wm-result-card:hover { box-shadow: var(--shadow-card-hover); border-color: var(--wm-blue); transform: translateY(-2px); }
  .wm-result-media { height: 130px; background: var(--wm-bg-alt); }
  .wm-result-media img { width: 100%; height: 100%; object-fit: cover; }
  .wm-result-body { padding: var(--space-4); }
  .wm-result-title { font-size: 0.9rem; font-weight: 700; margin: var(--space-1) 0 var(--space-2) 0; }
  .wm-result-price { font-weight: 700; font-size: 0.85rem; }

  @media (max-width: 900px) {
    .wm-hero-grid { grid-template-columns: 1fr; }
    .wm-trend-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 560px) {
    .wm-trend-grid { grid-template-columns: 1fr; }
    .wm-search-wrap select { max-width: 92px; font-size: 0.72rem; padding-inline: var(--space-2); }
    .wm-search-wrap input { font-size: 0.8rem; padding-inline: var(--space-3); }
  }
</style>
</head>
<body>

<div id="topnav-root"></div>

<div class="wm-toolbar-search-row">
  <div class="container">
    <div class="wm-search-wrap">
      <select id="wm-search-category"><option value="">All Categories</option></select>
      <input type="text" id="wm-search-input" placeholder="Search news, sellers, journalists&hellip;" autocomplete="off">
      <div class="wm-search-suggest hidden" id="wm-search-suggest"></div>
      <button id="wm-search-btn" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
  </div>
</div>

<main>
  <div class="container wm-section" id="wm-editorial-view">
    <div class="wm-hero-grid">
      <div id="wm-hero-area"></div>
      <div>
        <div class="wm-section-head"><span class="wm-section-title">Latest News</span><span class="wm-view-all" data-latest="1">View All</span></div>
        <div class="wm-latest-list" id="wm-latest-list"></div>
      </div>
    </div>
  </div>

  <div class="container wm-section">
    <div class="wm-section-head"><span class="wm-section-title">Top Categories</span></div>
    <div class="wm-cat-row" id="wm-cat-row"></div>
  </div>

  <div class="wm-section-tint">
    <div class="container wm-section">
      <div class="wm-section-head"><span class="wm-section-title">Trending Now</span><span class="wm-view-all" data-trending="1">View All</span></div>
      <div class="wm-trend-grid" id="wm-trend-grid"></div>
    </div>
  </div>

  <div class="container wm-section" id="wm-results-view" style="display:none;">
    <div class="wm-section-head">
      <span class="wm-section-title" id="wm-results-title">Results</span>
      <span class="wm-view-all" id="wm-back-to-home">&larr; Back to Home</span>
    </div>
    <div id="wm-results-status" class="text-muted" style="margin-bottom: var(--space-4);"></div>
    <div id="wm-results-people" class="wm-results-people" style="display:none;">
      <div class="wm-section-title" style="font-size:0.95rem;margin-bottom:var(--space-3);">Sellers &amp; Journalists</div>
      <div class="wm-results-people-grid" id="wm-results-people-grid"></div>
    </div>
    <div class="wm-results-grid" id="wm-results-grid"></div>
  </div>
</main>

<div id="footer-root"></div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
const CATEGORY_ICONS = {
  politics: '<path d="M3 21h18M5 21V10l7-6 7 6v11M9 21v-6h6v6"/>',
  business: '<path d="M3 3v18h18M7 15l4-4 3 3 5-6"/>',
  technology: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  world: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 6 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-6-3.5-9s1-6.5 3.5-9z"/>',
  africa: '<path d="M12 2c3 2 5 5 5 9 0 3-1 5-2 7-1 2-2 3-3 4-1-1-2-2-3-4-1-2-2-4-2-7 0-4 2-7 5-9z"/>',
  sports: '<circle cx="12" cy="12" r="9"/><path d="M12 3v18M4 8l16 8M4 16l16-8"/>',
  entertainment: '<path d="M4 4h16v12H4z"/><path d="M9 20h6M8 4l2 4M18 4l-2 4"/>',
  opinion: '<path d="M4 4h16v12H8l-4 4z"/>',
  health: '<path d="M12 21s-7-4.5-9.5-9C1 8.5 3 5 6.5 5c2 0 3.5 1.5 4 2.5.5-1 2-2.5 4-2.5C18 5 20 8.5 18.5 12c-2.5 4.5-9.5 9-9.5 9z"/>',
  science: '<circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="12" rx="9" ry="3.5"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(120 12 12)"/>',
  default: '<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/>',
};

function catIconSvg(name) {
  const key = Object.keys(CATEGORY_ICONS).find((k) => k !== 'default' && (name || '').toLowerCase().includes(k));
  return `<svg class="wm-cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${CATEGORY_ICONS[key || 'default']}</svg>`;
}

const rssLink = document.createElement('link');
rssLink.rel = 'alternate';
rssLink.type = 'application/rss+xml';
rssLink.title = 'WEMIX — Latest Verified Stories';
rssLink.href = `${API_BASE_URL}/feed.xml`;
document.head.appendChild(rssLink);

let ALL_CATEGORIES = [];

async function loadCategories() {
  try {
    const data = await apiFetch('/api/news/categories/', { auth: false });
    ALL_CATEGORIES = data.results || data;

    const searchSelect = document.getElementById('wm-search-category');
    ALL_CATEGORIES.forEach((c) => {
      const opt = document.createElement('option');
      opt.value = c.slug; opt.textContent = c.name;
      searchSelect.appendChild(opt);
    });

    document.getElementById('wm-cat-row').innerHTML = ALL_CATEGORIES.slice(0, 10).map((c) => `
      <div class="wm-cat-item" data-cat="${c.slug}">
        ${catIconSvg(c.name)}
        <span class="wm-cat-label">${escapeHtml(c.name)}</span>
      </div>
    `).join('');
    document.querySelectorAll('.wm-cat-item').forEach((el) => {
      el.addEventListener('click', () => showResults({ category: el.dataset.cat, label: el.querySelector('.wm-cat-label').textContent }));
    });
  } catch (e) { /* categories are optional UX sugar */ }
}

// The shared footer (js/nav.js renderFooter) links its category column to
// index.html?category=<slug> instead of calling showResults() directly --
// it has to work as a plain link since it's the same footer on every page,
// not just this one. Pick that up here on load.
const _initialCategory = new URLSearchParams(window.location.search).get('category');
if (_initialCategory) {
  showResults({ category: _initialCategory, label: _initialCategory.replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()) });
}

document.querySelectorAll('.wm-view-all[data-latest]').forEach((el) => {
  el.addEventListener('click', () => showResults({ label: 'Latest News' }));
});
document.querySelectorAll('.wm-view-all[data-trending]').forEach((el) => {
  el.addEventListener('click', () => showResults({ trending: true, label: 'Trending Now' }));
});
document.getElementById('wm-back-to-home').addEventListener('click', showHome);

function showHome() {
  document.getElementById('wm-editorial-view').style.display = '';
  document.querySelectorAll('.wm-section').forEach((s) => { if (s.id !== 'wm-results-view') s.style.display = ''; });
  document.getElementById('wm-results-view').style.display = 'none';
}

async function showResults({ q, category, trending, seller, sellerLabel, label }) {
  document.querySelectorAll('.wm-section').forEach((s) => { if (s.id !== 'wm-results-view') s.style.display = 'none'; });
  document.getElementById('wm-editorial-view').style.display = 'none';
  const resultsView = document.getElementById('wm-results-view');
  resultsView.style.display = '';
  document.getElementById('wm-results-title').textContent = label || (q ? `Results for "${q}"` : 'Results');

  const statusEl = document.getElementById('wm-results-status');
  const grid = document.getElementById('wm-results-grid');
  const peopleWrap = document.getElementById('wm-results-people');
  const peopleGrid = document.getElementById('wm-results-people-grid');
  statusEl.innerHTML = '<span class="spinner"></span> Loading&hellip;';
  grid.innerHTML = '';
  peopleWrap.style.display = 'none';
  peopleGrid.innerHTML = '';

  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (category) params.set('category', category);
  if (trending) params.set('trending', '1');
  if (seller) params.set('seller', seller);

  // A plain text search ("q") also checks for a matching seller/journalist/
  // media house account, not just stories -- run both lookups together so
  // people never have to know in advance whether they're searching for a
  // person or a headline.
  const peoplePromise = (q && !seller)
    ? apiFetch(`/api/accounts/search/?q=${encodeURIComponent(q)}`, { auth: false }).catch(() => [])
    : Promise.resolve([]);

  try {
    const [data, people] = await Promise.all([
      apiFetch(`/api/news/listings/?${params.toString()}`, { auth: false }),
      peoplePromise,
    ]);
    const results = data.results || data;
    const peopleResults = people.results || people;

    if (peopleResults.length) {
      peopleWrap.style.display = '';
      peopleGrid.innerHTML = peopleResults.map(personCardHtml).join('');
      peopleGrid.querySelectorAll('.wm-person-card').forEach((el) => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          showResults({ seller: el.dataset.sellerId, label: `Stories by ${el.dataset.sellerName}` });
        });
      });
    }

    statusEl.textContent = results.length ? `${results.length} stor${results.length === 1 ? 'y' : 'ies'}` : '';
    grid.innerHTML = results.length ? results.map(resultCardHtml).join('') :
      (peopleResults.length
        ? ''
        : `<div class="empty-state" style="grid-column:1/-1;"><h3>No stories found</h3><p>Try a different search or category.</p></div>`);
  } catch (e) {
    statusEl.innerHTML = `<span class="form-error">Could not load results: ${escapeHtml(formatApiError(e))}</span>`;
  }
}

function resultCardHtml(l) {
  return `
    <a class="wm-result-card" href="listing.html?slug=${encodeURIComponent(l.slug)}">
      <div class="wm-result-media">${l.cover_image ? `<img src="${l.cover_image}" alt="">` : ''}</div>
      <div class="wm-result-body">
        <div class="wm-pick-cat">${escapeHtml((l.news_type || '').replace('_', ' '))}</div>
        <div class="wm-result-title">${escapeHtml(l.title)}</div>
        <div class="wm-result-price">${money(l.price, l.currency)}</div>
      </div>
    </a>
  `;
}

function personInitial(p) {
  return escapeHtml(((p.organization_name || p.username || '?')[0] || '?').toUpperCase());
}

function personCardHtml(p) {
  const name = escapeHtml(p.organization_name || p.username);
  return `
    <a class="wm-person-card" href="#" data-seller-id="${p.id}" data-seller-name="${name}">
      <div class="wm-person-avatar">${p.avatar ? `<img src="${p.avatar}" alt="">` : personInitial(p)}</div>
      <div>
        <div class="wm-person-name">${name}${p.is_verified_badge ? ' ✓' : ''}</div>
        <div class="wm-person-meta">${escapeHtml((p.role || '').replace('_', ' '))}${p.listing_count ? ` &middot; ${p.listing_count} stor${p.listing_count === 1 ? 'y' : 'ies'}` : ''}</div>
      </div>
    </a>
  `;
}

document.getElementById('wm-search-btn').addEventListener('click', doSearch);
document.getElementById('wm-search-input').addEventListener('keyup', (e) => {
  if (e.key === 'Enter') doSearch();
  else if (e.key === 'Escape') hideSuggestions();
});
function doSearch() {
  hideSuggestions();
  const q = document.getElementById('wm-search-input').value.trim();
  const category = document.getElementById('wm-search-category').value;
  if (!q && !category) return;
  showResults({ q, category, label: q ? `Results for "${q}"` : undefined });
}

// Live "smart" suggestions -- as the user types, show matching seller/
// journalist/media-house accounts in a dropdown so they can jump straight
// to a person instead of typing a full search and submitting.
let suggestDebounce = null;
let suggestItems = [];
let suggestActiveIndex = -1;
const suggestBox = document.getElementById('wm-search-suggest');
const suggestInput = document.getElementById('wm-search-input');

function hideSuggestions() {
  suggestBox.classList.add('hidden');
  suggestBox.innerHTML = '';
  suggestItems = [];
  suggestActiveIndex = -1;
}

function renderSuggestions() {
  if (!suggestItems.length) { hideSuggestions(); return; }
  suggestBox.innerHTML = suggestItems.map((p, i) => `
    <div class="wm-search-suggest-item ${i === suggestActiveIndex ? 'active' : ''}" data-i="${i}">
      <div class="wm-search-suggest-avatar">${p.avatar ? `<img src="${p.avatar}" alt="">` : personInitial(p)}</div>
      <div>
        <div class="wm-search-suggest-name">${escapeHtml(p.organization_name || p.username)}${p.is_verified_badge ? ' ✓' : ''}</div>
        <div class="wm-search-suggest-meta">${escapeHtml((p.role || '').replace('_', ' '))}</div>
      </div>
    </div>
  `).join('');
  suggestBox.classList.remove('hidden');
  suggestBox.querySelectorAll('.wm-search-suggest-item').forEach((el) => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const p = suggestItems[Number(el.dataset.i)];
      hideSuggestions();
      showResults({ seller: p.id, label: `Stories by ${escapeHtml(p.organization_name || p.username)}` });
    });
  });
}

suggestInput.addEventListener('input', () => {
  const q = suggestInput.value.trim();
  clearTimeout(suggestDebounce);
  if (!q) { hideSuggestions(); return; }
  suggestDebounce = setTimeout(async () => {
    try {
      const data = await apiFetch(`/api/accounts/search/?q=${encodeURIComponent(q)}`, { auth: false });
      suggestItems = (data.results || data).slice(0, 6);
      suggestActiveIndex = -1;
      if (suggestInput.value.trim() === q) renderSuggestions();
    } catch (e) { /* suggestions are optional UX sugar */ }
  }, 250);
});
suggestInput.addEventListener('keydown', (e) => {
  if (suggestBox.classList.contains('hidden') || !suggestItems.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); suggestActiveIndex = Math.min(suggestActiveIndex + 1, suggestItems.length - 1); renderSuggestions(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); suggestActiveIndex = Math.max(suggestActiveIndex - 1, 0); renderSuggestions(); }
  else if (e.key === 'Enter' && suggestActiveIndex >= 0) {
    e.preventDefault();
    const p = suggestItems[suggestActiveIndex];
    hideSuggestions();
    showResults({ seller: p.id, label: `Stories by ${escapeHtml(p.organization_name || p.username)}` });
  }
});
document.addEventListener('click', (e) => { if (!suggestInput.contains(e.target) && !suggestBox.contains(e.target)) hideSuggestions(); });

let heroListings = [];
let heroIndex = 0;

function renderHero() {
  const area = document.getElementById('wm-hero-area');
  if (!heroListings.length) {
    area.innerHTML = `<div class="wm-hero-card"><div class="wm-hero-content"><h1>No published stories yet</h1><p>Be the first to publish a verified story on WEMIX.</p></div></div>`;
    return;
  }
  const l = heroListings[heroIndex];
  const readTime = l.reading_time_minutes ? `${l.reading_time_minutes} min read` : '';
  area.innerHTML = `
    <div class="wm-hero-card">
      ${l.cover_image ? `<img src="${l.cover_image}" alt="">` : ''}
      <div class="wm-hero-content">
        <span class="wm-hero-tag">${l.featured ? 'TOP STORY' : escapeHtml((l.news_type || '').toUpperCase())}</span>
        <h1>${escapeHtml(l.title)}</h1>
        <p>${escapeHtml(l.description || '')}</p>
        <div class="wm-hero-meta">By ${escapeHtml(l.seller_username || 'WEMIX')} &middot; ${timeAgo(l.created_at)}${readTime ? ' &middot; ' + readTime : ''}</div>
        ${heroListings.length > 1 ? `<div class="wm-hero-dots">${heroListings.map((_, i) => `<span class="wm-hero-dot ${i === heroIndex ? 'active' : ''}" data-i="${i}"></span>`).join('')}</div>` : ''}
      </div>
      ${heroListings.length > 1 ? `
        <button class="wm-hero-next-btn" aria-label="Next story">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      ` : ''}
    </div>
  `;
  area.querySelectorAll('.wm-hero-dot').forEach((dot) => {
    dot.addEventListener('click', () => { heroIndex = Number(dot.dataset.i); renderHero(); });
  });
  const nextBtn = area.querySelector('.wm-hero-next-btn');
  if (nextBtn) nextBtn.addEventListener('click', () => { heroIndex = (heroIndex + 1) % heroListings.length; renderHero(); });
}

function latestItemHtml(l) {
  return `
    <a class="wm-latest-item" href="listing.html?slug=${encodeURIComponent(l.slug)}">
      <div style="flex:1;">
        <div><span class="wm-latest-cat">${escapeHtml((l.news_type || '').replace('_', ' '))}</span><span class="wm-latest-time">${timeAgo(l.created_at)}</span></div>
        <div class="wm-latest-title">${escapeHtml(l.title)}</div>
      </div>
      <div class="wm-latest-thumb">${l.cover_image ? `<img src="${l.cover_image}" alt="">` : ''}</div>
    </a>
  `;
}

function trendCardHtml(l, i) {
  return `
    <a class="wm-trend-card" href="listing.html?slug=${encodeURIComponent(l.slug)}">
      <div class="wm-trend-card-media">
        <span class="wm-trend-rank">${i + 1}</span>
        ${l.cover_image ? `<img src="${l.cover_image}" alt="">` : ''}
      </div>
      <div class="wm-pick-cat">${escapeHtml((l.news_type || '').replace('_', ' '))}</div>
      <div class="wm-pick-title">${escapeHtml(l.title)}</div>
      <div class="wm-pick-desc">${escapeHtml((l.description || '').slice(0, 80))}${(l.description || '').length > 80 ? '…' : ''}</div>
      <div class="wm-pick-time">${timeAgo(l.created_at)} &middot; ${l.reading_time_minutes || 1} min read</div>
    </a>
  `;
}

async function loadHomepageData() {
  try {
    const data = await apiFetch('/api/news/listings/?ordering=-created_at', { auth: false });
    const results = data.results || data;

    const featured = results.filter((l) => l.featured);
    heroListings = (featured.length ? featured : results).slice(0, 5);
    renderHero();

    document.getElementById('wm-latest-list').innerHTML = results.length
      ? results.slice(0, 5).map(latestItemHtml).join('')
      : '<p class="text-muted">No stories yet.</p>';
  } catch (e) {
    document.getElementById('wm-hero-area').innerHTML = `<div class="alert alert-error">Could not load stories: ${escapeHtml(formatApiError(e))}</div>`;
  }

  try {
    const trendData = await apiFetch('/api/news/listings/?trending=1', { auth: false });
    const trendResults = (trendData.results || trendData).slice(0, 6);
    document.getElementById('wm-trend-grid').innerHTML = trendResults.length
      ? trendResults.map(trendCardHtml).join('')
      : '<p class="text-muted">Nothing trending yet.</p>';
  } catch (e) { /* trending is supplementary */ }
}

loadCategories();
loadHomepageData();
</script>
